<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f6ef7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>背单词 · 轻松积累你的词汇量</title>
<style>
:root{
  --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb;
  --brand:#4f6ef7; --brand2:#7c5cff; --ok:#0e9f6e; --bad:#ef4444;
  --card:#ffffff; --shadow:0 10px 30px rgba(31,36,48,.10);
}
[data-theme="dark"]{
  --ink:#e6e8ee; --sub:#9aa3b2; --line:#2a2f3a;
  --brand:#7c8cff; --brand2:#a07bff; --ok:#34d399; --bad:#f87171;
  --card:#1b1f27; --shadow:0 10px 30px rgba(0,0,0,.45);
}
[data-theme="dark"] body{ background:linear-gradient(165deg,#0f1320 0%,#161a26 50%,#1a1530 100%); }
[data-theme="dark"] input[type=text],[data-theme="dark"] input[type=password]{ background:#232838; color:var(--ink); border-color:#2a2f3a; }
[data-theme="dark"] .tabs{ background:#232838; }
[data-theme="dark"] .btn.ghost{ background:#1b1f27; }
[data-theme="dark"] .hint code{ background:#232838; }
[data-theme="dark"] .hero{ box-shadow:0 14px 34px rgba(0,0,0,.5); }
[data-theme="dark"] .feat{ border-color:rgba(255,255,255,.06); }
/* 首页学习主入口 Hero */
.hero{ border-radius:22px; padding:28px 24px; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand2)); box-shadow:0 14px 34px rgba(79,110,247,.32); margin-bottom:14px; position:relative; overflow:hidden; }
.hero::after{ content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; background:rgba(255,255,255,.12); border-radius:50%; }
.hero h2{ font-size:25px; margin:0 0 6px; letter-spacing:.5px; position:relative; }
.hero .sub{ opacity:.92; font-size:14px; margin-bottom:18px; position:relative; }
.hero .hbtn{ display:inline-block; background:#fff; color:var(--brand); border:none; border-radius:14px; padding:14px 26px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.18); position:relative; }
.hero .hbtn:active{ transform:scale(.97); }
.hero .hstats{ display:flex; gap:10px; margin-bottom:18px; position:relative; }
.hero .hstat{ background:rgba(255,255,255,.16); border-radius:14px; padding:10px 8px; flex:1; text-align:center; }
.hero .hstat b{ display:block; font-size:19px; }
.hero .hstat span{ font-size:11px; opacity:.92; }
.hero .ringwrap{ display:flex; align-items:center; gap:16px; margin-bottom:16px; position:relative; }
/* 次级功能网格（PK / 生词本 / 熟词本 / 自测） */
.feat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.feat{ background:var(--card); border:1px solid rgba(31,36,48,.05); border-radius:16px; padding:16px; cursor:pointer; box-shadow:var(--shadow); transition:.15s; position:relative; }
.feat:hover{ transform:translateY(-2px); }
.feat .ic{ font-size:22px; }
.feat .t{ font-weight:700; margin-top:6px; font-size:15px; }
.feat .d{ font-size:12px; color:var(--sub); margin-top:2px; }
.feat.pk{ background:linear-gradient(135deg,#fff,#f3f5ff); }
[data-theme="dark"] .feat.pk{ background:linear-gradient(135deg,#1b1f27,#20243a); }
.theme-toggle{ border:1px solid var(--line); background:var(--card); border-radius:9px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--ink); }
.level-badge{ display:inline-flex; align-items:center; gap:6px; background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700; }
/* 拼写（听写）模式 */
.spell-input{ width:100%; padding:14px 16px; font-size:20px; text-align:center; border:2px solid var(--brand); border-radius:14px; outline:none; background:#fafbfc; letter-spacing:1px; }
[data-theme="dark"] .spell-input{ background:#232838; }
.spell-input.ok{ border-color:var(--ok); }
.spell-input.bad{ border-color:var(--bad); }
/* 自定义词书 / 备份 列表 */
.cb-row{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
.cb-row:last-child{ border-bottom:none; }
.cb-row .nm{ flex:1; font-weight:600; }
.cb-row .ct{ font-size:12px; color:var(--sub); }
.cb-row .del{ border:none; background:rgba(239,68,68,.1); color:var(--bad); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12.5px; font-weight:600; }
.textarea{ width:100%; min-height:120px; padding:12px; border:1.5px solid var(--line); border-radius:12px; font-size:14px; outline:none; background:#fafbfc; resize:vertical; font-family:inherit; }
[data-theme="dark"] .textarea{ background:#232838; color:var(--ink); }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:linear-gradient(165deg,#eef2ff 0%,#f8fafc 50%,#f5f3ff 100%);
  color:var(--ink); min-height:100vh;
}
#app{max-width:720px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:26px;text-align:center;margin:18px 0 4px;letter-spacing:1px}
h1 .vs{color:var(--brand)}
.tagline{text-align:center;color:var(--sub);font-size:13px;margin-bottom:22px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border:1px solid rgba(31,36,48,.04)}
label.fl{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input[type=text],input[type=password]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:16px;outline:none;background:#fafbfc;transition:.15s;
}
input[type=text]:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.tabs{display:flex;background:#eef1f6;border-radius:12px;padding:4px;margin-bottom:6px}
.tabs button{
  flex:1;border:none;background:transparent;padding:10px 0;font-size:15px;border-radius:9px;
  cursor:pointer;color:var(--sub);font-weight:600;transition:.15s;
}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(31,36,48,.08)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:70px;padding:10px 6px;border:1.5px solid var(--line);background:#fff;border-radius:11px;
  font-size:14px;cursor:pointer;color:var(--ink);transition:.15s;white-space:nowrap;
}
.seg button.on{border-color:var(--brand);color:var(--brand);background:rgba(79,110,247,.07);font-weight:700}
.seg button small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
.btn{
  display:block;width:100%;padding:14px 0;border:none;border-radius:13px;font-size:17px;font-weight:700;
  cursor:pointer;margin-top:20px;transition:.15s;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 6px 18px rgba(79,110,247,.35);
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.hint{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:14px;background:#f6f8fc;border-radius:10px;padding:10px 12px}
.hint b{color:#475069}
.hint code{background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--brand)}
.roomcode-big{font-size:46px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--brand);margin:6px 0 2px;font-family:Consolas,monospace}
.share{text-align:center;font-size:13px;color:var(--sub)}
.share code{background:#f1f4fb;padding:2px 8px;border-radius:6px;color:#374151;font-size:12.5px;word-break:break-all}
.copybtn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:5px 14px;font-size:12.5px;cursor:pointer;margin-top:9px;font-weight:600}
.copybtn:active{transform:scale(.96)}
.plist{margin-top:14px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:#f8f9fc;margin-bottom:8px;font-size:15px}
.prow .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;flex:none}
.prow .dot.on{background:var(--ok)}
.prow .host{color:#d97706;font-size:13px}
.prow .me{color:var(--brand);font-size:12px;background:rgba(79,110,247,.1);border-radius:6px;padding:1px 7px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:#374151;box-shadow:0 2px 6px rgba(31,36,48,.05)}
.chip b{color:var(--brand)}
.chip.mode{background:linear-gradient(135deg,rgba(79,110,247,.1),rgba(124,92,255,.1));border-color:rgba(79,110,247,.25)}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.schip{background:#fff;border-radius:12px;padding:7px 12px;font-size:13.5px;box-shadow:0 2px 8px rgba(31,36,48,.06);border:1px solid var(--line);display:flex;align-items:center;gap:7px}
.schip .nm{max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schip .sc{font-weight:800;color:var(--brand)}
.schip.ans .sc{color:var(--ok)}
.schip.ans::after{content:'✓';color:var(--ok);font-weight:800}
.schip .rk{flex:none;width:21px;height:21px;border-radius:50%;background:#eef1f6;color:var(--sub);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.schip .rk.r1{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff}
.schip .rk.r2{background:linear-gradient(135deg,#9ca3af,#6b7280);color:#fff}
.schip .rk.r3{background:linear-gradient(135deg,#e8a87c,#c97b4a);color:#fff}
.schip.me{border-color:var(--brand);background:rgba(79,110,247,.07);box-shadow:0 0 0 2px rgba(79,110,247,.18)}
.rankchip b{color:#d97706;font-size:14px}
.qwrap{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:26px 20px;text-align:center;position:relative;overflow:hidden}
.qmeta{font-size:13px;color:var(--sub);margin-bottom:8px}
.word{font-size:44px;font-weight:800;letter-spacing:1px;color:#111827;margin:10px 0 6px;font-family:Georgia,"Times New Roman",serif}
.meaning{font-size:18px;color:var(--ok);font-weight:700}
.listen-btn{
  width:110px;height:110px;border-radius:50%;border:none;cursor:pointer;margin:14px auto;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:44px;
  box-shadow:0 10px 26px rgba(79,110,247,.4);display:flex;align-items:center;justify-content:center;transition:.15s;
}
.listen-btn:active{transform:scale(.94)}
.listen-tip{font-size:12.5px;color:var(--sub)}
.timerbar{height:7px;background:#eef1f6;border-radius:99px;overflow:hidden;margin:16px 0 4px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;width:100%}
.timerbar.danger i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.tsec{text-align:right;font-size:12.5px;color:var(--sub)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:480px){.opts{grid-template-columns:1fr}.word{font-size:34px}}
.opt{
  border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:15px 10px;font-size:15.5px;
  cursor:pointer;text-align:left;display:flex;gap:9px;align-items:center;line-height:1.35;outline:none;
}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;background:#eef1f6;color:var(--sub);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.correct{border-color:var(--ok);background:rgba(14,159,110,.09);font-weight:700}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.08)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.picked{border-color:var(--brand);background:rgba(79,110,247,.07)}
.opt:disabled{cursor:default}
.waiting{margin-top:14px;font-size:13.5px;color:var(--sub);text-align:center}
.myfb{margin-top:14px;font-size:15px;font-weight:800;padding:11px 14px;border-radius:12px;animation:pop .3s ease;text-align:center}
.myfb.ok{background:rgba(14,159,110,.13);color:var(--ok)}
.myfb.bad{background:rgba(239,68,68,.1);color:var(--bad)}
.myfb b{font-size:17px}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.gain{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.gain span{font-size:12.5px;border-radius:8px;padding:3px 10px;background:#f3f4f6;color:#4b5563}
.gain span.up{background:rgba(14,159,110,.12);color:var(--ok);font-weight:700}
.gain span.down{background:rgba(239,68,68,.1);color:var(--bad)}
.rank{margin-top:6px}
.rrow{display:flex;align-items:center;gap:12px;background:#f8f9fc;border-radius:13px;padding:13px 15px;margin-bottom:9px}
.rrow.first{background:linear-gradient(135deg,#fff7e6,#fffbea);border:1px solid #fde68a}
.rrow .medal{font-size:24px;width:34px;text-align:center;flex:none}
.rrow .rname{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rstat{text-align:right;font-size:12.5px;color:var(--sub)}
.rrow .rstat b{display:block;font-size:19px;color:var(--brand)}
.rrow.first .rstat b{color:#d97706}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111827;color:#fff;
  padding:10px 20px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
  max-width:86vw;text-align:center;
}
.toast.show{opacity:.95}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.logo .ic{font-size:30px}
.footer-tip{text-align:center;color:#9ca3af;font-size:12px;margin-top:26px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.speak-flash{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(79,110,247,.4)}50%{box-shadow:0 10px 40px rgba(124,92,255,.75)}}
/* ---------- 首页功能入口 ---------- */
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.feat .btn{margin-top:0;padding:13px 6px;font-size:14.5px}
@media (max-width:480px){.feat{grid-template-columns:1fr}}
/* ---------- 生词本 ---------- */
.wb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.wb-count{font-size:13px;color:var(--sub)}
.wrow{display:flex;align-items:center;gap:10px;background:#f8f9fc;border-radius:11px;padding:11px 13px;margin-bottom:8px}
.wrow .w{font-weight:800;font-size:16px;font-family:Georgia,"Times New Roman",serif;min-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .m{flex:1;font-size:13.5px;color:#374151;line-height:1.4}
.wrow .b{flex:none;font-size:11.5px;color:var(--sub);background:#eef1f6;border-radius:6px;padding:2px 7px}
.wrow .del{flex:none;border:none;background:rgba(239,68,68,.1);color:var(--bad);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.wrow .del:active{transform:scale(.96)}
.wrow .kw{flex:none;border:none;background:rgba(16,185,129,.12);color:var(--ok);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.wrow .kw:active{transform:scale(.96)}
.wb-empty{text-align:center;color:var(--sub);font-size:14px;padding:26px 0 10px;line-height:1.8}
/* ---------- 词汇量自测 ---------- */
.vt-progress{font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px}
.vt-tier-badge{display:inline-block;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));border-radius:999px;padding:3px 12px;margin-bottom:8px}
.vt-btns{display:flex;gap:12px;margin-top:20px}
.vt-btns button{flex:1;padding:15px 0;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff;outline:none}
.vt-btns .yes{color:var(--ok);border-color:var(--ok)}
.vt-btns .yes:active{background:rgba(14,159,110,.1)}
.vt-btns .no{color:var(--bad);border-color:var(--bad)}
.vt-btns .no:active{background:rgba(239,68,68,.08)}
.vt-verify-tip{font-size:13px;color:var(--sub);text-align:center;margin-top:12px}
.vt-est{font-size:52px;font-weight:800;text-align:center;color:var(--brand);margin:4px 0 2px;line-height:1.1}
.vt-est-label{text-align:center;color:var(--sub);font-size:13px;margin-bottom:14px}
.vt-tier{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.vt-tier:last-child{border-bottom:none}
.vt-tier .tn{flex:none;width:3em;color:var(--sub)}
.vt-tier .bar{flex:1;height:10px;background:#eef1f6;border-radius:99px;overflow:hidden}
.vt-tier .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.vt-tier .tv{flex:none;font-weight:700;color:#374151}
.rank-me{background:rgba(79,110,247,.07);border:1.5px solid var(--brand);border-radius:13px;padding:12px 15px;font-size:14px;color:#374151;text-align:center;margin-bottom:10px}
.rank-me b{color:var(--brand);font-size:18px}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:#f8f9fc;margin-bottom:7px;font-size:14.5px}
.rank-row.me{border:1.5px solid var(--brand);background:rgba(79,110,247,.07)}
.rank-row .rk2{flex:none;width:22px;height:22px;border-radius:50%;background:#eef1f6;color:var(--sub);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rank-row .rk2.r1{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff}
.rank-row .rk2.r2{background:linear-gradient(135deg,#9ca3af,#6b7280);color:#fff}
.rank-row .rk2.r3{background:linear-gradient(135deg,#e8a87c,#c97b4a);color:#fff}
.rank-row .rn2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rank-row .rv2{flex:none;font-weight:800;color:var(--brand);font-size:16px}
.rank-row.me .rv2{color:var(--brand)}
/* ---------- 背单词 · 学习模块 ---------- */
.stu-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
@media (max-width:480px){.stu-stats{grid-template-columns:repeat(2,1fr)}}
.stu-stat{background:#f8f9fc;border-radius:12px;padding:10px 4px;text-align:center}
.stu-stat b{display:block;font-size:20px;color:var(--brand);line-height:1.2}
.stu-stat b.fire{color:#f97316}
.stu-stat b.okc{color:var(--ok)}
.stu-stat span{font-size:11.5px;color:var(--sub)}
.stu-today{display:flex;align-items:center;gap:14px}
.stu-ring{flex:none;width:92px;height:92px;position:relative}
.stu-ring svg{transform:rotate(-90deg)}
.stu-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--brand)}
.stu-ring .num small{font-size:10px;color:var(--sub);font-weight:400}
.stu-td-info{flex:1;font-size:13.5px;color:#374151;line-height:1.9}
.stu-td-info b{color:var(--brand)}
.stu-cal{display:flex;gap:3px;margin-top:12px;align-items:flex-end}
.stu-cal i{flex:1;height:14px;border-radius:3px;background:#eef1f6;min-width:4px}
.stu-cal i.l1{background:#c7d2fe}.stu-cal i.l2{background:#a5b4fc}.stu-cal i.l3{background:#818cf8}.stu-cal i.l4{background:#4f6ef7}
.stu-cal-cap{font-size:11.5px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}
.ugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:300px;overflow-y:auto;padding:2px 4px 2px 0}
@media (max-width:480px){.ugrid{grid-template-columns:repeat(3,1fr)}}
.uchip{border:1.5px solid var(--line);border-radius:11px;padding:8px 4px 7px;text-align:center;cursor:pointer;background:#fff;transition:.12s;position:relative}
.uchip:active{transform:scale(.96)}
.uchip b{font-size:13px;display:block}
.uchip small{font-size:10px;color:var(--sub);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip .ub{height:4px;background:#eef1f6;border-radius:99px;margin-top:6px;overflow:hidden}
.uchip .ub i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.uchip.now{border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,110,247,.15)}
.uchip.done{border-color:rgba(14,159,110,.5)}
.uchip.done .ub i{background:var(--ok)}
.uchip .un{position:absolute;top:-7px;right:-5px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:800;border-radius:99px;padding:1px 6px}

.seg2{display:flex;gap:8px;flex-wrap:wrap}
.seg2 button{flex:1;min-width:60px;padding:9px 6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:13.5px;cursor:pointer;color:var(--ink);transition:.15s;white-space:nowrap}
.seg2 button.on{border-color:var(--brand);color:var(--brand);background:rgba(79,110,247,.07);font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;background:#f6f8fc;border-radius:11px;padding:12px 14px;margin-top:14px;font-size:14.5px;cursor:pointer}
.switch .sw{flex:none;width:44px;height:25px;border-radius:99px;background:#d1d5db;position:relative;transition:.2s}
.switch .sw::after{content:'';position:absolute;top:2.5px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s}
.switch.on .sw{background:var(--ok)}
.switch.on .sw::after{left:21px}
.stu-num{display:flex;align-items:center;gap:10px}
.stu-num input{flex:1}
.stu-num .copybtn{margin:0;flex:none}
.sfb{margin-top:14px;font-size:15px;font-weight:800;padding:11px 14px;border-radius:12px;animation:pop .3s ease;text-align:center}
.sfb.ok{background:rgba(14,159,110,.13);color:var(--ok)}
.sfb.bad{background:rgba(239,68,68,.1);color:var(--bad)}
.sfb small{display:block;font-weight:500;font-size:12.5px;margin-top:3px}
.wq{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:24px 20px 20px;text-align:center}
.wq .word{cursor:pointer}
.wq .pos-tag{display:inline-block;font-size:11px;color:var(--brand);background:rgba(79,110,247,.1);border-radius:99px;padding:2px 10px;margin-bottom:4px}
.stu-progress{display:flex;gap:4px;margin:14px 0 0}
.stu-progress i{flex:1;height:5px;border-radius:99px;background:#eef1f6;min-width:2px}
.stu-progress i.ok{background:var(--ok)}
.stu-progress i.bad{background:var(--bad)}
.stu-progress i.cur{background:var(--brand)}
.wl-row{display:flex;align-items:center;gap:10px;background:#f8f9fc;border-radius:11px;padding:10px 13px;margin-bottom:8px}
.wl-row .w{font-weight:800;font-size:15.5px;font-family:Georgia,serif;min-width:92px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-row .m{flex:1;font-size:13px;color:#374151;line-height:1.4}
.wl-row .x{flex:none;font-size:11px;color:var(--bad);background:rgba(239,68,68,.08);border-radius:6px;padding:2px 7px}
.danger-zone{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.danger-zone button{width:100%;margin-top:8px;padding:11px 0;border-radius:11px;border:1.5px solid rgba(239,68,68,.4);background:rgba(239,68,68,.05);color:var(--bad);font-size:13.5px;font-weight:600;cursor:pointer}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="/books.bundle.js"></script>
<script>
'use strict';
var $ = function(s){ return document.querySelector(s); };
var app = $('#app');

/* ---------- 全局状态 ---------- */
var BOOKS = [];
var INFO = { ips: [], port: 3000 };
var token = localStorage.getItem('vpk_token') || '';   // 登录令牌
var account = null;     // {username, name} 当前登录账号
var session = null;      // {roomId, playerId}
var es = null;           // EventSource
var cur = null;          // 最近一次房间状态
var page = 'home';       // auth | home | room | wrongbook | vocab
var wrongList = [];      // 生词本数据
var vq = null;           // 词汇量测试状态 {questions, tiers, idx, answers, phase}
/* 按词书 id 查语言（en/es），用于朗读发音 */
function bookLangOf(id){
  for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].id === id) return BOOKS[i].lang || 'en';
  return 'en';
}
var LANG_NAMES = { en: '英语', es: '西班牙语' };
/* 按语言分组的词书下拉选项（英语 / 西班牙语） */
function bookOptionsHTML(selectedId, list){
  var src = list && list.length ? list : BOOKS;
  var langs = [];
  src.forEach(function(b){ var ln = b.lang || 'en'; if (langs.indexOf(ln) < 0) langs.push(ln); });
  return langs.map(function(ln){
    var items = src.filter(function(b){ return (b.lang || 'en') === ln; }).map(function(b){
      var tag = b.custom ? ' ★' : '';
      return '<option value="' + esc(b.id) + '"' + (b.id === selectedId ? ' selected' : '') + '>' + esc(b.name) + '（' + b.count + '词）' + tag + '</option>';
    }).join('');
    return langs.length > 1 ? '<optgroup label="' + (LANG_NAMES[ln] || ln) + '">' + items + '</optgroup>' : items;
  }).join('');
}
var clockOffset = 0;     // 服务器时钟偏移
var rafId = null;
var lastSpokenQ = -1;
var myLocalPick = null;   // 点击瞬间的本地高亮选项（服务器确认前兜底）
var lastPickQ = -1;       // 本地高亮对应的题号
var myLocalCorrect = null;   // 本地即时判题结果（null=未判定，true/false=已判定）
var myLocalCorrectIdx = -1;  // 本地判定的正确选项位置
var _bk = null;           // 已解码的本地词书
var _bkReady = false;     // 本地词书是否已就绪（支持 DecompressionStream 且解码成功）

/* ---------- 基础函数 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- 本地词书（答案内置浏览器，防 F12 直读；老浏览器自动降级为服务器判题） ---------- */
var _BK_KEY = String.fromCharCode(86,79,67,65,66,80,75,95,83,51,67,82,69,84,95,75,69,89); // VOCABPK_S3CRET_KEY
function decodeBooks(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ _BK_KEY.charCodeAt(i % _BK_KEY.length);
  var ds = new DecompressionStream('deflate');
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Response(stream).arrayBuffer().then(function(buf){
    return JSON.parse(new TextDecoder('utf-8').decode(buf));
  });
}
function loadLocalBooks(){
  if (_bkReady) return Promise.resolve(_bk);
  if (!window.__VOCAB_BOOKS__) return Promise.resolve(null);
  try {
    return decodeBooks(window.__VOCAB_BOOKS__).then(function(books){
      _bk = books; _bkReady = true; return books;
    }).catch(function(){ _bkReady = true; _bk = null; return null; });
  } catch (e) {
    return Promise.resolve(null); // DecompressionStream 不可用 → 保持服务器判题
  }
}
// 本地判题：在词书里查 word 的释义，返回其在选项中的位置；查不到返回 -1
function localCorrectIdx(word, bookId, options){
  if (!_bk || !word || !options || !options.length) return -1;
  var list = null;
  if (bookId) {
    for (var i = 0; i < _bk.length; i++) if (_bk[i].id === bookId) { list = _bk[i].words; break; }
  }
  var meaning = null;
  if (list) {
    for (var j = 0; j < list.length; j++) if (list[j][0] === word) { meaning = list[j][1]; break; }
  }
  if (meaning === null) { // 兜底：整库查找
    for (var a = 0; a < _bk.length && meaning === null; a++) {
      var wl = _bk[a].words;
      for (var b = 0; b < wl.length; b++) if (wl[b][0] === word) { meaning = wl[b][1]; break; }
    }
  }
  if (meaning === null) return -1;
  return options.indexOf(meaning);
}
function applyLocalJudge(v){
  if (!v || !v.question) return;
  var lc = localCorrectIdx(v.question.word, v.settings && v.settings.bookId, v.question.options);
  if (lc >= 0) {
    myLocalCorrect = (myLocalPick === lc);
    myLocalCorrectIdx = lc;
    renderGame(v);
  }
}

function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function copyText(txt, okMsg){
  function fallback(){
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast(okMsg || '已复制');
    } catch (e) { toast('复制失败，请手动复制'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg || '已复制'); }, fallback);
  } else fallback();
}
function api(path, body, method){
  return fetch(path, {
    method: method || (body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok || d.error) throw new Error(d.error || ('请求失败 ' + r.status));
      return d;
    });
  });
}
function speak(word, lang){
  lang = (lang === 'es') ? 'es' : 'en';
  try {
    if (!('speechSynthesis' in window)) { toast('当前浏览器不支持语音朗读，建议使用 Chrome/Edge'); return; }
    var u = new SpeechSynthesisUtterance(word);
    u.lang = (lang === 'es') ? 'es-ES' : 'en-US';
    u.rate = 0.85;
    var voices = speechSynthesis.getVoices();
    var v = null;
    var want = (lang === 'es') ? /^es(-|_)/i : /^en(-|_)US/i;
    var loose = (lang === 'es') ? /^es/i : /^en/i;
    for (var i = 0; i < voices.length; i++) {
      if (want.test(voices[i].lang)) { v = voices[i]; break; }
    }
    if (!v) for (var j = 0; j < voices.length; j++) if (loose.test(voices[j].lang)) { v = voices[j]; break; }
    if (v) u.voice = v;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    if (lang === 'es' && !v) {} // 系统未装西语语音包时浏览器仍会用默认音尝试发音
  } catch (e) {}
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){}; }

/* ---------- SSE + 轮询兜底 ---------- */
var pollTimer = null;   // 轮询定时器
var sseAlive = false;   // 是否已通过 SSE 收到过数据
var lastStateStr = '';  // 最近一次渲染的状态（排除 serverNow），用于轮询去重
function applyState(v){
  try {
    clockOffset = v.serverNow - Date.now();
    cur = v;
    if (page === 'room') {
      // 轮询每秒一次，但只有状态真正变化才重渲染（避免 DOM 重建吞掉用户点击）
      var s = JSON.stringify(v, function(k, val){ return k === 'serverNow' ? 0 : val; });
      if (s !== lastStateStr) { lastStateStr = s; render(); }
    }
  } catch (err) {}
}
function startPolling(roomId, playerId){
  if (pollTimer) return;
  pollTimer = setInterval(function(){
    fetch('/api/state?roomId=' + encodeURIComponent(roomId) + '&playerId=' + encodeURIComponent(playerId))
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && !d.error) applyState(d); })
      .catch(function(){});
  }, 1000);
}
function stopPolling(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function connect(roomId, playerId){
  if (es) { es.close(); es = null; }
  sseAlive = false;
  lastStateStr = '';
  es = new EventSource('/api/stream?roomId=' + encodeURIComponent(roomId) + '&playerId=' + encodeURIComponent(playerId));
  es.onmessage = function(e){
    try {
      sseAlive = true;
      stopPolling(); // SSE 正常工作，停掉轮询兜底
      applyState(JSON.parse(e.data));
    } catch (err) {}
  };
  // 4 秒内 SSE 没收到首帧（网络缓冲了事件流）→ 自动降级为轮询
  setTimeout(function(){
    if (!sseAlive && session && session.roomId === roomId) startPolling(roomId, playerId);
  }, 4000);
  es.onerror = function(){
    if (es && es.readyState === 2) {
      // 服务器断开：EventSource 会自动重连；期间由轮询兜底保证状态更新
      if (session && session.roomId === roomId) startPolling(roomId, playerId);
    }
  };
}
function leaveRoom(){
  if (es) { es.close(); es = null; }
  stopPolling();
  sseAlive = false;
  lastStateStr = '';
  session = null; cur = null; lastSpokenQ = -1; myLocalPick = null; lastPickQ = -1; myLocalCorrect = null; myLocalCorrectIdx = -1;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  page = 'home';
  renderHome();
}

/* ---------- 登录 / 注册 ---------- */
function onAuthed(d){
  token = d.token;
  account = { username: d.username, name: d.name };
  localStorage.setItem('vpk_token', token);
  page = 'home';
  renderHome();
}
function renderAuth(){
  page = 'auth';
  app.innerHTML =
  '<h1><span class="logo"><span class="ic">⚡</span>单词<span class="vs">PK</span></span></h1>' +
  '<div class="tagline">登录后即可对战 · 生词本与昵称绑定账号，永不错乱</div>' +
  '<div class="card">' +
    '<div class="tabs">' +
      '<button id="tabLogin" class="on">登录</button>' +
      '<button id="tabReg">注册</button>' +
    '</div>' +
    '<label class="fl">用户名</label>' +
    '<input type="text" id="userInput" maxlength="16" placeholder="3-16 位字母/数字/下划线" autocapitalize="off" spellcheck="false">' +
    '<label class="fl">密码</label>' +
    '<input type="password" id="passInput" maxlength="32" placeholder="至少 6 位">' +
    '<div id="nameWrap" style="display:none">' +
      '<label class="fl">昵称（游戏中显示，可随时修改）</label>' +
      '<input type="text" id="nickInput" maxlength="12" placeholder="给自己起个名字">' +
    '</div>' +
    '<button class="btn" id="authBtn">登录 🚀</button>' +
    '<div class="hint"><b>说明</b><br>· 账号用于保存你的<b>独立生词本</b>和<b>昵称</b>，换设备、清缓存都不丢；<br>· 按你的要求<b>不支持上传头像</b>；<br>· 注册后自动登录。</div>' +
  '</div>';

  var mode = 'login';
  function switchTab(m){
    mode = m;
    $('#tabLogin').classList.toggle('on', m === 'login');
    $('#tabReg').classList.toggle('on', m === 'reg');
    $('#nameWrap').style.display = m === 'reg' ? '' : 'none';
    $('#authBtn').textContent = m === 'login' ? '登录 🚀' : '注册并登录 🚀';
  }
  $('#tabLogin').onclick = function(){ switchTab('login'); };
  $('#tabReg').onclick = function(){ switchTab('reg'); };

  $('#authBtn').onclick = function(){
    var username = $('#userInput').value.trim();
    var password = $('#passInput').value;
    var btn = this; btn.disabled = true;
    var restore = function(){ btn.disabled = false; };
    if (mode === 'reg') {
      if (!/^[a-zA-Z0-9_]{3,16}$/.test(username)) { toast('用户名需 3-16 位字母/数字/下划线'); restore(); return; }
      if (password.length < 6) { toast('密码至少 6 位'); restore(); return; }
      api('/api/register', { username: username, password: password, name: $('#nickInput').value.trim() })
        .then(onAuthed).catch(function(e){ toast(e.message); restore(); });
    } else {
      api('/api/login', { username: username, password: password })
        .then(onAuthed).catch(function(e){ toast(e.message); restore(); });
    }
  };
}

/* ---------- 首页 ---------- */
/* 当前是否通过公网地址访问（非 localhost / 非局域网 IP） */
function isPublicVisit(){
  var h = location.hostname;
  return h !== 'localhost' && h !== '127.0.0.1' && !/^192\.168\.|^10\.|^172\.(1[6-9]|2\d|3[01])\./.test(h);
}
function applyTheme(){
  var t = localStorage.getItem('vpk_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  var b = document.getElementById('thBtn');
  if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  localStorage.setItem('vpk_theme', cur === 'dark' ? 'light' : 'dark');
  applyTheme();
}
function wireTopbar(){
  var enb = document.getElementById('editNameBtn');
  if (enb) enb.onclick = function(){
    var nn = prompt('修改昵称（最多 12 字）：', account ? account.name : '');
    if (nn === null) return;
    nn = nn.trim().slice(0, 12);
    if (!nn) return;
    api('/api/me', { token: token, name: nn }, 'POST')
      .then(function(d){ account.name = d.name; toast('昵称已更新'); renderHome(); })
      .catch(function(e){ toast(e.message); });
  };
  var lob = document.getElementById('logoutBtn');
  if (lob) lob.onclick = function(){
    api('/api/logout', { token: token }, 'POST').catch(function(){});
    token = ''; account = null; localStorage.removeItem('vpk_token');
    page = 'auth'; renderAuth();
  };
  var thb = document.getElementById('thBtn');
  if (thb) thb.onclick = function(){ toggleTheme(); };
}
function renderHome(){
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  applyTheme();
  var topbar =
    '<div class="topbar" style="justify-content:space-between">' +
      '<span class="chip">👤 <b>' + esc(account ? account.name : '') + '</b> · @' + esc(account ? account.username : '') + '</span>' +
      '<span><button class="theme-toggle" id="thBtn">🌙</button> <button class="copybtn" id="editNameBtn">✏️ 昵称</button> <button class="copybtn" id="logoutBtn">退出</button></span>' +
    '</div>';
  app.innerHTML = topbar + '<div class="tagline"><span class="spin"></span></div>';
  api('/api/study/overview?token=' + encodeURIComponent(token), null, 'GET')
    .then(function(ov){
      var hasPlan = !!ov.plan;
      var t = ov.today || { new: 0, review: 0, wrong: 0, dailyNew: 20, newRemaining: 0 };
      var hero;
      if (hasPlan) {
        hero =
          '<div class="hstats">' +
            '<div class="hstat"><b>' + t.new + '</b><span>今日新词 / ' + t.dailyNew + '</span></div>' +
            '<div class="hstat"><b>' + (ov.learned || 0) + '</b><span>已学词</span></div>' +
            '<div class="hstat"><b>' + (ov.mastered || 0) + '</b><span>已掌握</span></div>' +
          '</div>' +
          '<div style="font-weight:800;font-size:15px;margin-bottom:4px">📚 ' + esc(ov.bookName) + '</div>' +
          '<button class="hbtn" id="hStudy">继续背单词 ▸</button> ' +
          '<button class="hbtn" id="hReview" style="background:rgba(255,255,255,.2);color:#fff">🎯 复习生词本</button>';
      } else {
        hero =
          '<h2>📚 背单词</h2>' +
          '<div class="sub">按词频科学排序 · 间隔重复记忆 · 支持西语</div>' +
          '<button class="hbtn" id="hStudy">开始制定计划 ▸</button>';
      }
      app.innerHTML = topbar +
        '<div class="hero">' + hero + '</div>' +
        '<div class="feat-grid">' +
          '<div class="feat pk" id="fPk"><div class="ic">⚡</div><div class="t">单词PK 对战</div><div class="d">和小伙伴实时比拼</div></div>' +
          '<div class="feat" id="fWrong"><div class="ic">📒</div><div class="t">生词本</div><div class="d">' + (ov.wrongCount || 0) + ' 个答错的词</div></div>' +
          '<div class="feat" id="fKnown"><div class="ic">📗</div><div class="t">熟词本</div><div class="d">' + (ov.knownCount || 0) + ' 个已掌握</div></div>' +
          '<div class="feat" id="fVocab"><div class="ic">📊</div><div class="t">词汇量自测</div><div class="d">测测你有多少词</div></div>' +
        '</div>' +
        '<div class="footer-tip">背单词为主，PK 对战为辅 · 学习错题与 PK 错题共享同一本生词本</div>';
      $('#hStudy').onclick = function(){ page = 'study'; renderStudy(); };
      var hr = $('#hReview'); if (hr) hr.onclick = function(){ page = 'study'; stuStart('review'); };
      $('#fPk').onclick = function(){ renderPk(); };
      $('#fWrong').onclick = function(){ page = 'wrongbook'; renderWrongbook(); };

function renderVocabStart(){
  app.innerHTML =
  '<h1>📊 词汇量自测</h1>' +
  '<div class="tagline">7 个难度层 · 每层 6 题 · 约 2 分钟测完 · 成绩记入账号 @' + esc(account ? account.username : '') + '</div>' +

      '· 单词从「中考 → 高考 → 四级 → 六级 → 考研 → 雅思 → 托福」逐层随机出现；<br>' +
      '· 认识的词选「✅ 认识」并挑出正确释义（选对才计认识）；<br>' +
      '· 认识但释义选错 = 拿不准，算一半；完全没见过就选「❌ 不认识」；<br>' +
      '· 按每层认识比例估算该层词数，累加得总词汇量，最好成绩进排行榜。' +
    '</div>' +
    '<button class="btn" id="vtStart">开始测试 🚀</button>' +
    '<button class="btn ghost" id="vtRankOnly">查看排行榜 🏆</button>' +
    '<button class="btn ghost" id="vtBack">返回首页</button>' +
  '</div>';
  $('#vtStart').onclick = function(){
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>出题中…';
    api('/api/vocabtest/questions')
      .then(function(d){
        vq = { questions: d.questions, tiers: d.tiers, idx: 0, answers: [], phase: 'q' };
        renderVocabQ();
      })
      .catch(function(e){ toast(e.message); btn.disabled = false; btn.innerHTML = '开始测试 🚀'; });
  };
  $('#vtRankOnly').onclick = renderVocabRank;
  $('#vtBack').onclick = function(){ page = 'home'; renderHome(); };
}

function renderVocabQ(){
  if (!vq) { renderVocabStart(); return; }
  var q = vq.questions[vq.idx];
  var tierName = vq.tiers[q.tier] ? vq.tiers[q.tier].name : '';
  var isVerify = vq.phase === 'verify';
  var letters = ['A','B','C','D'];
  app.innerHTML =
  '<h1>📊 词汇量自测</h1>' +
  '<div class="card" style="text-align:center">' +
    '<div class="vt-progress">第 ' + (vq.idx + 1) + ' / ' + vq.questions.length + ' 题 · ' + esc(tierName) + ' 难度</div>' +
    (isVerify ? '' : '<div class="word" style="margin-top:4px">' + esc(q.word) + '</div>') +
    (isVerify
      ? '<div class="vt-verify-tip">这个词你认识吗？选出正确释义<br>（认识但选错 = 拿不准，算一半）</div>' +
        '<div class="opts">' + q.options.map(function(o, i){
          return '<button class="opt" data-i="' + i + '"><span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
        }).join('') + '</div>'
      : '<div class="vt-btns">' +
          '<button class="yes" id="vtYes">✅ 认识</button>' +
          '<button class="no" id="vtNo">❌ 不认识</button>' +
        '</div>') +
  '</div>' +
  '<div class="card" style="padding:14px"><button class="btn ghost" id="vtQuit">退出测试</button></div>';

  function next(credit){
    vq.answers.push({ word: q.word, tier: q.tier, credit: credit });
    vq.idx += 1;
    if (vq.idx >= vq.questions.length) { vq.phase = 'done'; renderVocabResult(); }
    else { vq.phase = 'q'; renderVocabQ(); }
  }
  if (isVerify) {
    app.querySelectorAll('.opt').forEach(function(btn){
      btn.onclick = function(){
        var i = +btn.getAttribute('data-i');
        next(i === q.correctIndex ? 1 : 0.5);
      };
    });
  } else {
    $('#vtYes').onclick = function(){ vq.phase = 'verify'; renderVocabQ(); };
    $('#vtNo').onclick = function(){ next(0); };
  }
  $('#vtQuit').onclick = function(){ vq = null; page = 'home'; renderHome(); };
}

function renderVocabResult(){
  var name = account ? account.username : '';
  var counts = {};
  vq.answers.forEach(function(a){ counts[a.tier] = (counts[a.tier] || 0) + 1; });
  var countsArr = (vq.tiers || []).map(function(_, i){ return counts[i] || 0; });
  app.innerHTML = '<h1>📊 正在测算…</h1><div class="tagline"><span class="spin"></span></div>';
  api('/api/vocabtest/submit', { token: token, answers: vq.answers, counts: countsArr })
    .then(function(d){
      var maxE = Math.max.apply(null, d.estimates.map(function(t){ return t.value; }).concat([1]));
      var tiersHtml = d.estimates.map(function(t){
        var pct = Math.round(t.value / maxE * 100);
        return '<div class="vt-tier"><span class="tn">' + esc(t.tier) + '</span>' +
          '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
          '<span class="tv">' + t.value + '</span></div>';
      }).join('');
      app.innerHTML =
      '<h1>📊 测试完成</h1>' +
      '<div class="card" style="text-align:center">' +
        '<div class="vt-est">≈ ' + d.estimate.toLocaleString() + '</div>' +
        '<div class="vt-est-label">你的估算词汇量（各层认识比例 × 该层词数）</div>' +
        tiersHtml +
      '</div>' +
      '<div class="card" id="vtRankBox"><div style="text-align:center;color:var(--sub);padding:10px">加载排行榜…</div></div>' +
      '<div class="card" style="padding:14px">' +
        '<button class="btn" id="vtAgain">再测一次 🔁</button>' +
        '<button class="btn ghost" id="vtDone">返回首页</button>' +
      '</div>';
      $('#vtAgain').onclick = function(){ renderVocabStart(); };
      $('#vtDone').onclick = function(){ vq = null; page = 'home'; renderHome(); };
      api('/api/vocabrank?token=' + encodeURIComponent(token), null, 'GET')
        .then(function(rk){
          var box = $('#vtRankBox');
          if (!box) return;
          var meHtml = rk.you
            ? '<div class="rank-me">我的排名 <b>#' + rk.you.rank + '</b> · 最好成绩 <b>' + rk.you.best.toLocaleString() + '</b> 词 · 测过 ' + rk.you.count + ' 次</div>'
            : '';
          var rows = (rk.list || []).slice(0, 30).map(function(x){
            var medal = x.rank === 1 ? '🥇' : (x.rank === 2 ? '🥈' : (x.rank === 3 ? '🥉' : x.rank));
            var me = rk.you && String(x.name).toLowerCase() === String(account ? account.username : '').toLowerCase() ? ' me' : '';
            return '<div class="rank-row' + me + '">' +
              '<span class="rk2 r' + Math.min(x.rank, 3) + '">' + medal + '</span>' +
              '<span class="rn2">' + esc(x.name) + '</span>' +
              '<span class="rv2">' + x.best.toLocaleString() + '</span>' +
            '</div>';
          }).join('');
          box.innerHTML = '<div class="wb-head"><span class="wb-count">🏆 词汇量排行榜（最好成绩）</span></div>' + meHtml + (rows || '<div class="wb-empty">暂无数据</div>');
        })
        .catch(function(){
          var box = $('#vtRankBox');
          if (box) box.innerHTML = '<div class="wb-empty">排行榜加载失败，成绩已保存</div>';
        });
    })
    .catch(function(e){ toast(e.message); renderVocabStart(); });
}

/* ---------- 学习 session ---------- */
function stuStart(mode, unit, label){
  var url = '/api/study/session?token=' + encodeURIComponent(token) + '&mode=' + mode + '&inputMode=' + encodeURIComponent(stu.inputMode || 'choice');
  if (unit != null) url += '&unit=' + unit;
  app.innerHTML = '<h1>📚 背单词</h1><div class="tagline"><span class="spin"></span>出题中…</div>';
  api(url, null, 'GET').then(function(d){
    if (!d.questions || !d.questions.length) {
      toast(mode === 'daily' ? '今日任务已完成，去单元里加练或复习生词吧' : (mode === 'review' ? '生词本是空的' : '该单元没有需要练的词'));
      renderStudy();
      return;
    }
    stu.sess = {
      mode: mode, unit: unit == null ? null : unit, label: label || (mode === 'review' ? '生词本复习' : '每日任务'),
      queue: d.questions.slice(), idx: 0, right: 0, wrong: 0, wrongWords: [], marks: [],
      autoSpeak: d.plan && d.plan.autoSpeak !== false, extra: d, lock: false, startedAt: Date.now(),
      lang: d.lang === 'es' ? 'es' : 'en',
    };
    stu.view = 'session';
    renderStuQuestion();
  }).catch(function(e){ toast(e.message); renderStudy(); });
}
function renderStuQuestion(){
  var s = stu.sess;
  if (!s || s.idx >= s.queue.length) { renderStuSummary(); return; }
  var q = s.queue[s.idx];
  if (stu.lastSpeak !== q.word) {
    stu.lastSpeak = q.word;
    if (s.autoSpeak) setTimeout(function(){ if (stu.view === 'session') speak(q.word, s.lang); }, 350);
  }
  var letters = ['A', 'B', 'C', 'D'];
  var total = s.queue.length;
  var marks = '';
  for (var i = 0; i < Math.min(total, 60); i++) {
    var cls = i < s.marks.length ? (s.marks[i] ? 'ok' : 'bad') : (i === s.idx ? 'cur' : '');
    marks += '<i class="' + cls + '"></i>';
  }
  var modeTag = s.mode === 'review' ? '🎯 生词复习' : (s.mode === 'unit' ? '📘 ' + (s.label || '单元练习') : (q.isNew ? '🌱 新词' : '🔁 复习'));

  var body;

    body =

      '<div class="word" id="sqWord" title="点击朗读">' + esc(q.meaning) + '</div>' +
      '<input class="spell-input" id="sqInput" placeholder="输入 ' + (s.lang === 'es' ? '西语' : '英文') + ' 单词，回车确认" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<button class="btn" id="sqSubmit" style="width:100%;margin-top:12px">确认 ✔</button>' +
      '<div id="sqFb"></div>' +
      '<div class="hint" style="margin-top:12px">⌨️ 输入后按 Enter 确认 · 点上方释义可朗读该词 · 拼错会记入生词本</div>';
  } else {
    body =
      '<div class="qmeta">第 ' + (s.idx + 1) + ' / ' + total + ' 题 · 选出这个单词的中文意思</div>' +
      '<div class="word" id="sqWord" title="点击朗读">' + esc(q.word) + '</div>' +
      '<div class="stu-progress">' + marks + '</div>' +
      '<div class="opts" id="sqOpts">' + (q.options || []).map(function(o, i){
        return '<button class="opt" data-i="' + i + '"><span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join('') + '</div>' +
      '<div id="sqFb"></div>' +
      '<div class="hint" style="margin-top:12px">⌨️ 键盘 1-4 也可作答 · 点单词可朗读 · 答错的词稍后会自动再出一次</div>';
  }
  app.innerHTML =
  '<div class="topbar" style="justify-content:space-between">' +
    '<span class="chip mode">' + modeTag + '</span>' +
    '<span class="chip">✓ <b>' + s.right + '</b> · ✗ <b style="color:var(--bad)">' + s.wrong + '</b></span>' +
    '<button class="copybtn" id="sqQuit">退出</button>' +
  '</div>' +
  '<div class="wq">' + body + '</div>' +
  '<button class="btn ghost" id="sqKnown" style="width:100%;margin-top:14px">✅ 我认识这个（移入熟词本）</button>';
  $('#sqWord').onclick = function(){ speak(q.word, s.lang); };

  $('#sqKnown').onclick = function(){ stuMarkKnown(q.word); };
  if (spell) {
    var inp = $('#sqInput');

      inp.focus();
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); stuSpellSubmit(); } });
    }
    var sb = $('#sqSubmit'); if (sb) sb.onclick = stuSpellSubmit;
  } else {
    app.querySelectorAll('#sqOpts .opt').forEach(function(btn){
      btn.onclick = function(){ stuPick(+btn.getAttribute('data-i')); };
    });
  }

/* 拼写题：看释义写词，提交后比对 */
function stuSpellSubmit(){
  var s = stu.sess; if (!s || s.lock) return;
  var q = s.queue[s.idx]; if (!q) return;
  var inp = $('#sqInput'); if (!inp) return;
  var val = inp.value.trim().toLowerCase();
  if (!val) { toast('请先输入单词'); return; }
  var correct = val === String(q.word).trim().toLowerCase();
  var fb = $('#sqFb');
  if (fb) fb.innerHTML = correct
    ? '<div class="sfb ok">🎉 拼写正确！</div>'
    : '<div class="sfb bad">😅 拼写有误<small>正确拼写：' + esc(q.word) + '</small></div>';
  inp.classList.add(correct ? 'ok' : 'bad');
  s.lock = true;
  s.marks[s.idx] = correct;
  if (correct) s.right += 1; else s.wrong += 1;
  if (!correct) {
    if (!s.wrongWords.some(function(w){ return w.word === q.word; })) s.wrongWords.push({ word: q.word, meaning: q.meaning, my: val });
  }
  api('/api/study/answer', { token: token, word: q.word, correct: correct }, 'POST')
    .then(function(d){ if (d.mastered && !d.removed) toast('「' + q.word + '」已达到掌握等级 🎓'); })
    .catch(function(){});
  setTimeout(function(){
    if (!stu.sess || stu.sess !== s) return;
    s.lock = false;
    s.idx += 1;
    if (s.idx >= s.queue.length) renderStuSummary();
    else renderStuQuestion();
  }, correct ? 900 : 1900);
}
/* 标记为已会：直接移入熟词本并跳过本题 */
function stuMarkKnown(word){
  var s = stu.sess; if (!s || s.lock) return;
  s.lock = true;
  s.marks[s.idx] = true;
  api('/api/study/markKnown', { token: token, word: word }, 'POST')
    .then(function(){
      toast('已移入熟词本 📗');
      s.lock = false;
      s.idx += 1;
      if (s.idx >= s.queue.length) renderStuSummary();
      else renderStuQuestion();
    })
    .catch(function(e){ s.lock = false; toast(e.message); });
}
function stuPick(choice){
  var s = stu.sess;
  if (!s || s.lock) return;
  var q = s.queue[s.idx];
  if (!q) return;
  s.lock = true;
  var correct = choice === q.correctIndex;
  var letters = ['A', 'B', 'C', 'D'];
  app.querySelectorAll('#sqOpts .opt').forEach(function(btn){
    var i = +btn.getAttribute('data-i');
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add('correct');
    else if (i === choice) btn.classList.add('wrong');
  });
  s.marks[s.idx] = correct;
  if (correct) s.right += 1; else s.wrong += 1;
  if (!correct) {
    if (!s.wrongWords.some(function(w){ return w.word === q.word; })) s.wrongWords.push({ word: q.word, meaning: q.meaning, my: q.options[choice] });
    // 答错重排：3 题之后（或最后）再考一次，最多重排 2 次
    q._rq = (q._rq || 0) + 1;
    if (q._rq <= 2) {
      var at = Math.min(s.queue.length, s.idx + 4);
      s.queue.splice(at, 0, q);
    }
  }
  var fb = $('#sqFb');
  if (fb) fb.innerHTML = correct
    ? '<div class="sfb ok">🎉 答对了！<small>' + esc(q.word) + ' · ' + esc(q.meaning) + '</small></div>'
    : '<div class="sfb bad">😅 答错了<small>正确释义：' + esc(q.meaning) + (q._rq <= 2 ? ' · 稍后再考你一次' : '') + '</small></div>';
  api('/api/study/answer', { token: token, word: q.word, correct: correct }, 'POST')
    .then(function(d){
      if (d.removed) toast('「' + q.word + '」已连续答对 5 次，从生词本毕业 🎓');
      if (d.mastered && !d.removed) toast('「' + q.word + '」已达到掌握等级 🎓');
    })
    .catch(function(){});
  setTimeout(function(){
    if (!stu.sess || stu.sess !== s) return;
    s.lock = false;
    s.idx += 1;
    if (s.idx >= s.queue.length) renderStuSummary();
    else renderStuQuestion();
  }, correct ? 900 : 1900);
}
function stuQuit(){
  var s = stu.sess;
  if (!s) { renderStudy(); return; }
  var done = s.right + s.wrong;
  if (done > 0 && !confirm('已答 ' + done + ' 题，退出后本组剩余的词下次再来。确定退出？')) return;
  stu.view = 'dash';
  renderStudy();
}
function renderStuSummary(){
  stu.view = 'summary';
  var s = stu.sess;

  var wrongHtml = s.wrongWords.length ? s.wrongWords.map(function(w){

      '<span class="m">' + esc(w.meaning) + '</span><span class="x">✗' + (w.my ? ' 选了「' + esc(w.my) + '」' : '') + '</span></div>';
  }).join('') : '<div class="wb-empty">本轮全部答对，零错词 🎯</div>';
  app.innerHTML =
  '<h1>📝 本轮完成</h1>' +

      '<div class="stu-stat"><b class="okc">' + s.right + '</b><span>答对</span></div>' +
      '<div class="stu-stat"><b style="color:var(--bad)">' + s.wrong + '</b><span>答错</span></div>' +
      '<div class="stu-stat"><b>' + acc + '%</b><span>正确率</span></div>' +
    '</div>' +
    (s.wrongWords.length ? '<div class="hint" style="text-align:left;margin-top:14px"><b>答错的词已自动记入生词本</b>（与 PK 共用一本），点单词可跟读。</div>' : '') +
  '</div>' +
  '<div class="card">' +
    '<div class="wb-head"><span class="wb-count">本轮错词（' + s.wrongWords.length + '）</span></div>' +
    wrongHtml +
  '</div>' +
  '<div class="card" style="padding:14px">' +
    '<button class="btn" id="ssAgain">再来一轮 🔁</button>' +
    '<button class="btn ghost" id="ssHome">返回学习主页</button>' +
  '</div>';
  app.querySelectorAll('.wl-row .w').forEach(function(el){

  });

/* ---------- 整账户备份 / 恢复 ---------- */
function exportBackup(){
  api('/api/backup?token=' + encodeURIComponent(token), null, 'GET')
    .then(function(d){
      var data = d.backup || {};
      data.app = 'vocab-pk'; data.version = 1;
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'vocab-pk-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      toast('备份已导出 📤');
    })
    .catch(function(e){ toast(e.message); });
}
function importBackup(){
  if (!confirm('导入备份将覆盖当前的生词本、熟词本、自定义词书与学习进度。确定继续？')) return;
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();

      try {

        api('/api/restore', { token: token, backup: data }, 'POST')
          .then(function(){ toast('备份已恢复 📥'); page = 'study'; renderStudy(); })
          .catch(function(e){ toast(e.message); });

  };

}

/* ---------- 对战 ---------- */
function renderGame(v){
  var q = v.question || {};
  var isListen = v.settings.mode === 'listen';
  var players = v.players.slice().sort(function(a,b){ return b.score - a.score || b.correctCount - a.correctCount; });
  var myRank = 1;
  for (var ri = 0; ri < players.length; ri++) { if (players[ri].id === v.you) { myRank = ri + 1; break; } }
  var scoreChips = players.map(function(p, idx){
    var isMe = p.id === v.you;
    return '<div class="schip ' + (p.answered ? 'ans' : '') + (isMe ? ' me' : '') + '" title="' + esc(p.name) + '">' +
      '<span class="rk r' + Math.min(idx + 1, 3) + '">' + (idx + 1) + '</span>' +
      '<span class="nm">' + esc(p.name) + (isMe ? '（我）' : '') + '</span>' +
      '<span class="sc">' + p.score + '</span></div>';
  }).join('');
  // 本地乐观高亮：换题时清空；服务器已确认的选择优先
  if (lastPickQ !== v.qIndex) { myLocalPick = null; myLocalCorrect = null; myLocalCorrectIdx = -1; lastPickQ = v.qIndex; }
  var serverChoice = (q.myChoice !== null && q.myChoice !== undefined) ? q.myChoice : null;
  var myChoice = serverChoice !== null ? serverChoice : myLocalPick;
  var answered = v.phase === 'question' && myChoice !== null;
  // 显示结果：服务器已回传 → 以服务器为准（含分数）；否则用本地即时判定兜底（秒反馈）
  var myRes = null;
  if (answered && q.myCorrect !== undefined && q.myCorrect !== null) {
    myRes = { correct: q.myCorrect, gained: q.myGained, correctIndex: q.correctIndex, choice: myChoice };
  } else if (answered && myLocalCorrect !== null && lastPickQ === v.qIndex) {
    myRes = { correct: myLocalCorrect, gained: null, correctIndex: myLocalCorrectIdx, choice: myLocalPick };
  }
  var letters = ['A','B','C','D'];

  var centerHtml;
  if (v.phase === 'question') {
    if (isListen) {
      centerHtml = '<button class="listen-btn speak-flash" id="replayBtn" title="点击重听">🔊</button>' +
        '<div class="listen-tip">正在播放单词读音 · 点喇叭可重听</div>';
    } else {
      centerHtml = '<div class="word">' + esc(q.word) + '</div>';
    }
  } else {
    centerHtml = '<div class="word">' + esc(q.word) + '</div>' +
      '<div class="meaning">✔ ' + esc(q.options[v.lastResult ? v.lastResult.correctIndex : 0]) + '</div>';
  }

  var optsHtml = (q.options || []).map(function(o, i){
    var cls = 'opt';
    var dis = (v.phase === 'reveal') || answered;
    if (v.phase === 'reveal') {
      var lr = v.lastResult;
      if (lr && i === lr.correctIndex) cls += ' correct';
      else if (lr && lr.results[v.you] && lr.results[v.you].choice === i) cls += ' wrong';
      else if (lr && i === myChoice) cls += ' picked';
    } else if (myRes) {
      // 已答：立即标出我的对错（正确项绿 / 我的错项红）
      if (i === myRes.correctIndex) cls += ' correct';
      else if (i === myRes.choice) cls += ' wrong';
    } else if (answered && i === myChoice) {
      cls += ' picked';
    }
    return '<button class="' + cls + '" data-i="' + i + '" ' + (dis ? 'disabled' : '') + '>' +
      '<span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
  }).join('');

  var gainHtml = '';
  if (v.phase === 'reveal' && v.lastResult) {
    gainHtml = '<div class="gain">' + v.players.map(function(p){
      var r = v.lastResult.results[p.id];
      if (!r) return '<span>' + esc(p.name) + ' 未作答</span>';
      return '<span class="' + (r.correct ? 'up' : 'down') + '">' + esc(p.name) + ' ' + (r.correct ? '+' + r.gained : '✗') + '</span>';
    }).join('') + '</div>';
  }

  var waitHtml = '';
  if (v.phase === 'question' && answered) {
    if (myRes) {
      waitHtml = myRes.correct
        ? (myRes.gained != null
            ? '🎉 答对了！+<b>' + myRes.gained + '</b> 分（基础 100 + 速度加成 ' + (myRes.gained - 100) + '）'
            : '🎉 答对了！得分结算中…')
        : '<div class="myfb bad">😅 答错了，正确答案已标绿</div>';
    } else {
      waitHtml = '<div class="waiting">已作答，等待其他玩家…（答得越快加成越高）</div>';
    }
  }
  if (v.phase === 'reveal') {
    waitHtml = '<div class="waiting">下一题马上开始…</div>';
  }

  app.innerHTML =
  '<div class="topbar">' +
    '<span class="chip">房间 <b>' + esc(v.roomId) + '</b></span>' +
    '<span class="chip">' + esc(v.bookName) + '</span>' +
    '<span class="chip mode">' + (isListen ? '🎧 听音辨义' : '📖 看词选义') + '</span>' +
    '<span class="chip">第 <b>' + (v.qIndex + 1) + '</b> / ' + v.total + ' 题</span>' +
    '<span class="chip rankchip">我的排名 <b>#' + myRank + '</b></span>' +
  '</div>' +
  '<div class="scores">' + scoreChips + '</div>' +
  '<div class="qwrap">' +
    '<div class="qmeta">' + (v.phase === 'reveal' ? '本题答案' : (isListen ? '听单词，选出中文意思' : '选出这个单词的中文意思')) + '</div>' +
    centerHtml +
    '<div class="timerbar" id="tbar"><i id="tfill"></i></div>' +
    '<div class="tsec" id="tsec"></div>' +
    '<div class="opts">' + optsHtml + '</div>' +
    waitHtml + gainHtml +
  '</div>';

  // 选项点击
  app.querySelectorAll('.opt').forEach(function(btn){
    btn.onclick = function(){
      if (!session || answered) return;
      answered = true;
      myLocalPick = +btn.getAttribute('data-i');  // 立即本地高亮，不等服务器
      lastPickQ = v.qIndex;
      // 本地即时判题：词书已就绪立即亮对错，否则等词书加载完成（通常已预加载好）
      if (_bkReady) {
        applyLocalJudge(v);
      } else {
        loadLocalBooks().then(function(){
          if (!session || lastPickQ !== v.qIndex) return;
          applyLocalJudge(cur || v);
        });
      }
      api('/api/answer', { roomId: session.roomId, playerId: session.playerId, qIndex: v.qIndex, choice: myLocalPick })
        .catch(function(e){ toast(e.message); });
    };
  });
  var rb = $('#replayBtn');
  if (rb) rb.onclick = function(){ speak(q.word, bookLangOf(v.settings && v.settings.bookId)); };

  // 听力模式自动朗读（每题一次）
  if (v.phase === 'question' && isListen && lastSpokenQ !== v.qIndex) {
    lastSpokenQ = v.qIndex;
    setTimeout(function(){ if (cur && cur.phase === 'question') speak(q.word, bookLangOf(v.settings && v.settings.bookId)); }, 500);
  }

  // 倒计时条
  if (rafId) cancelAnimationFrame(rafId);
  var fill = $('#tfill'), tbar = $('#tbar'), tsec = $('#tsec');
  if (v.phase === 'question' && q.deadline) {
    var dur = q.durationMs || 12000;
    var deadlineLocal = q.deadline - clockOffset;
    function tick(){
      var now = Date.now();
      var remain = Math.max(0, deadlineLocal - now);
      var pct = Math.max(0, Math.min(100, remain / dur * 100));
      if (fill) fill.style.width = pct + '%';
      if (tbar) tbar.classList.toggle('danger', pct < 25);
      if (tsec) tsec.textContent = (remain / 1000).toFixed(1) + ' 秒';
      if (pct > 0 && cur && cur.phase === 'question') rafId = requestAnimationFrame(tick);
    }
    tick();
  } else {
    if (fill) fill.style.width = '0%';
    if (tsec) tsec.textContent = '';
  }
}

/* ---------- 结果 ---------- */
function renderResult(v){
  var medals = ['🥇','🥈','🥉'];
  var players = v.players.slice().sort(function(a,b){ return b.score - a.score || b.correctCount - a.correctCount; });
  var meHost = false;
  var rows = players.map(function(p, i){
    if (p.id === v.you) meHost = p.isHost;
    var medal = i < 3 ? medals[i] : '<span style="color:#9ca3af;font-weight:700">' + (i + 1) + '</span>';
    var meCls = i === 0 ? 'rrow first' : 'rrow';
    var statHtml = p.isNew
      ? '<b style="color:var(--brand)">--</b>刚加入 · 等待下一局'
      : '<b>' + p.score + ' 分</b>答对 ' + p.correctCount + ' / ' + v.total;
    return '<div class="' + meCls + '">' +
      '<div class="medal">' + medal + '</div>' +
      '<div class="rname">' + esc(p.name) + (p.id === v.you ? '（我）' : '') + '</div>' +
      '<div class="rstat">' + statHtml + '</div>' +
    '</div>';
  }).join('');
  app.innerHTML =
  '<h1>🏆 对战结束</h1>' +
  '<div class="tagline">' + esc(v.bookName) + ' · ' + (v.settings.mode === 'listen' ? '听音辨义' : '看词选义') + ' · ' + v.total + ' 题</div>' +
  '<div class="card rank">' + rows + '</div>' +
  '<div class="card" style="padding:16px">' +
    (meHost
      ? '<button class="btn" id="replayBtn">再来一局 🔁（换一批新词）</button>'
      : '<div class="waiting" style="margin:6px 0 4px">等房主发起再来一局…</div>') +
    '<button class="btn ghost" id="backBtn">返回首页</button>' +
  '</div>';
  var rp = $('#replayBtn');
  if (rp) rp.onclick = function(){
    rp.disabled = true; rp.innerHTML = '<span class="spin"></span>生成新题目…';
    api('/api/replay', { roomId: session.roomId, playerId: session.playerId })
      .catch(function(e){ toast(e.message); rp.disabled = false; rp.innerHTML = '再来一局 🔁'; });
  };
  $('#backBtn').onclick = leaveRoom;
}

/* ---------- 渲染分发 ---------- */
function render(){
  if (page !== 'room' || !cur) return;
  if (cur.phase === 'lobby') renderLobby(cur);
  else if (cur.phase === 'result') renderResult(cur);
  else renderGame(cur);
}

/* ---------- 启动 ---------- */
function boot(){
  applyTheme();
  loadLocalBooks().then(function(books){
    if (books) BOOKS = books.map(function(b){ return { id: b.id, name: b.name, count: (b.words || []).length, lang: b.lang || 'en' }; });
    else return api('/api/books').then(function(d){ BOOKS = d.books; }).catch(function(){});
  }).then(function(){
    return api('/api/info').then(function(d){ INFO = d; }).catch(function(){});
  }).then(function(){
    if (!token) { renderAuth(); return; }
    // 已有令牌：校验有效性并取回账号信息
    return api('/api/me?token=' + encodeURIComponent(token), null, 'GET')
      .then(function(d){
        if (d && d.username) { account = { username: d.username, name: d.name }; renderHome(); }
        else { token = ''; localStorage.removeItem('vpk_token'); renderAuth(); }
      })
      .catch(function(){ token = ''; localStorage.removeItem('vpk_token'); renderAuth(); });
  });
}
boot();
</script>
<script>
/* 注册 Service Worker：让网页可「添加到主屏幕」当作 App 安装，并支持离线打开首页 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
}
</script>
