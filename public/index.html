<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007AFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>背他喵的 · 轻松积累你的词汇量</title>
<style>
:root{
  --ink:#1c1c1e; --sub:#8e8e93; --line:#e3e3e8;
  --brand:#007AFF; --brand2:#5e5ce6; --ok:#34C759; --bad:#FF3B30;
  --card:#ffffff; --bg:#f2f2f7;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --glass:rgba(255,255,255,.72); --glass-brd:rgba(255,255,255,.55);
  --radius:20px; --radius-sm:13px; --ease:cubic-bezier(.32,.72,0,1);
  --hair:0.5px solid rgba(60,60,67,.12);
}
[data-theme="dark"]{
  --ink:#f2f2f7; --sub:#98989f; --line:#38383a;
  --brand:#0A84FF; --brand2:#5e5ce6; --ok:#30D158; --bad:#FF453A;
  --card:#1c1c1e; --bg:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.55);
  --glass:rgba(28,28,30,.72); --glass-brd:rgba(255,255,255,.10);
  --hair:0.5px solid rgba(84,84,90,.5);
}
[data-theme="dark"] body{ background:linear-gradient(180deg,#0a0b0d 0%,#000 100%); }
[data-theme="dark"] input[type=text],[data-theme="dark"] input[type=password]{ background:#2c2c2e; color:var(--ink); border-color:#3a3a3c; }
[data-theme="dark"] .tabs{ background:#2c2c2e; }
[data-theme="dark"] .btn.ghost{ background:#1c1c1e; }
[data-theme="dark"] .hint code{ background:#2c2c2e; }
[data-theme="dark"] .hero{ box-shadow:0 16px 40px rgba(0,0,0,.55); }
[data-theme="dark"] .feat{ border-color:rgba(255,255,255,.08); }
/* 首页学习主入口 Hero（克制 iOS 蓝：白底卡片 + 蓝色仅作点缀） */
.hero{ border-radius:26px; padding:30px 26px; color:var(--ink); background:var(--card); border:var(--hair); box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden; }
.hero::after{ content:""; position:absolute; right:-50px; top:-50px; width:190px; height:190px; background:radial-gradient(circle at 30% 30%,rgba(0,122,255,.08),transparent 70%); border-radius:50%; }
.hero::before{ content:""; position:absolute; left:-40px; bottom:-60px; width:170px; height:170px; background:radial-gradient(circle at 50% 50%,rgba(0,122,255,.05),transparent 70%); border-radius:50%; }
.hero h2{ font-size:26px; margin:0 0 6px; letter-spacing:.3px; position:relative; font-weight:700; color:var(--ink); }
.hero .sub{ color:var(--sub); font-size:14px; margin-bottom:18px; position:relative; }
.hero .hbtn{ display:inline-block; background:var(--brand); color:#fff; border:none; border-radius:15px; padding:14px 28px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 6px 16px rgba(0,122,255,.22); position:relative; transition:transform .12s var(--ease), box-shadow .12s var(--ease); }
.hero .hbtn:active{ transform:scale(.96); }
.hero .hbtn-ghost{ background:#fff; color:var(--brand); border:1.5px solid var(--brand); box-shadow:none; }
.hero .hbtns{ display:flex; flex-direction:column; gap:10px; }
.hero .hbtns .hbtn{ width:100%; text-align:center; box-sizing:border-box; margin:0; }
.hero .hstats{ display:flex; gap:10px; margin-bottom:18px; position:relative; }
.hero .hstat{ background:rgba(0,122,255,.08); border-radius:16px; padding:10px 8px; flex:1; text-align:center; }
.hero .hstat b{ display:block; font-size:20px; font-weight:700; color:var(--ink); }
.hero .hstat span{ font-size:11px; color:var(--sub); }
.hero .ringwrap{ display:flex; align-items:center; gap:16px; margin-bottom:16px; position:relative; }
/* 次级功能网格（PK / 生词本 / 熟词本 / 自测） */
.feat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
.feat{ background:var(--card); border:var(--hair); border-radius:var(--radius); padding:18px; cursor:pointer; box-shadow:var(--shadow); transition:transform .18s var(--ease), box-shadow .18s var(--ease); position:relative; }
.feat:hover{ transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.08); }
.feat .ic{ font-size:24px; }
.feat .t{ font-weight:600; margin-top:8px; font-size:15.5px; }
.feat .d{ font-size:12.5px; color:var(--sub); margin-top:3px; }
.feat.pk{ background:#eef5ff; }
[data-theme="dark"] .feat.pk{ background:linear-gradient(150deg,#1c1c1e,#232038); }
.theme-toggle{ border:1px solid var(--line); background:var(--card); border-radius:9px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--ink); }
.level-badge{ display:inline-flex; align-items:center; gap:6px; background:rgba(0,122,255,.12); color:var(--brand); border:1px solid rgba(0,122,255,.2); border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700; }
/* 拼写（听写）模式 */
.spell-input{ width:100%; padding:14px 16px; font-size:20px; text-align:center; border:2px solid var(--brand); border-radius:15px; outline:none; background:#f2f2f7; letter-spacing:1px; transition:.15s var(--ease); }
[data-theme="dark"] .spell-input{ background:#2c2c2e; color:var(--ink); }
.spell-input.ok{ border-color:var(--ok); background:rgba(52,199,89,.06); }
.spell-input.bad{ border-color:var(--bad); background:rgba(255,59,48,.05); }
/* 自定义词书 / 备份 列表 */
.cb-row{ display:flex; align-items:center; gap:8px; padding:11px 0; border-bottom:var(--hair); }
.cb-row:last-child{ border-bottom:none; }
.cb-row .nm{ flex:1; font-weight:600; }
.cb-row .ct{ font-size:12px; color:var(--sub); }
.cb-row .del{ border:none; background:rgba(255,59,48,.12); color:var(--bad); border-radius:9px; padding:6px 11px; cursor:pointer; font-size:12.5px; font-weight:600; }
.textarea{ width:100%; min-height:120px; padding:12px; border:1.5px solid var(--line); border-radius:13px; font-size:14px; outline:none; background:#f2f2f7; resize:vertical; font-family:inherit; transition:.15s var(--ease); color:var(--ink); }
[data-theme="dark"] .textarea{ background:#2c2c2e; color:var(--ink); }
.textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,122,255,.14)}
[data-theme="dark"] .textarea:focus{background:#1c1c1e;box-shadow:0 0 0 4px rgba(0,122,255,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink); min-height:100vh;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  letter-spacing:.2px;
}
::selection{ background:rgba(0,122,255,.18); }
*::-webkit-scrollbar{ width:8px; height:8px; }
*::-webkit-scrollbar-thumb{ background:rgba(120,120,128,.36); border-radius:99px; }
*::-webkit-scrollbar-track{ background:transparent; }
#app{max-width:720px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:27px;text-align:center;margin:18px 0 4px;letter-spacing:.5px;font-weight:800}
h1 .vs{color:var(--brand)}
.tagline{text-align:center;color:var(--sub);font-size:13px;margin-bottom:22px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border:var(--hair)}
label.fl{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input[type=text],input[type=password]{
  width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;
  font-size:16px;outline:none;background:#f2f2f7;transition:.18s var(--ease);color:var(--ink);
}
[data-theme="dark"] input[type=text],[data-theme="dark"] input[type=password]{ background:#2c2c2e; }
input[type=text]:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(0,122,255,.14)}
[data-theme="dark"] input[type=text]:focus{background:#1c1c1e;box-shadow:0 0 0 4px rgba(10,132,255,.22)}
.tabs{display:flex;background:#e9e9ec;border-radius:12px;padding:3px;margin-bottom:8px}
[data-theme="dark"] .tabs{ background:#2c2c2e; }
.tabs button{
  flex:1;border:none;background:transparent;padding:9px 0;font-size:15px;border-radius:9px;
  cursor:pointer;color:var(--sub);font-weight:600;transition:.18s var(--ease);
}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.10)}
[data-theme="dark"] .tabs button.on{background:#3a3a3c;color:var(--brand)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:70px;padding:11px 6px;border:1.5px solid var(--line);background:#f2f2f7;border-radius:13px;
  font-size:14px;cursor:pointer;color:var(--ink);transition:.18s var(--ease);white-space:nowrap;
}
[data-theme="dark"] .seg button{background:#2c2c2e;}
.seg button.on{border-color:var(--brand);color:var(--brand);background:#eaf3ff;font-weight:600}
[data-theme="dark"] .seg button.on{background:rgba(10,132,255,.16);}
.seg button small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
.btn{
  display:block;width:100%;padding:15px 0;border:none;border-radius:15px;font-size:17px;font-weight:600;
  cursor:pointer;margin-top:20px;transition:transform .12s var(--ease), box-shadow .12s var(--ease);color:#fff;
  background:var(--brand);box-shadow:0 6px 16px rgba(0,122,255,.22);
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
[data-theme="dark"] .btn.ghost{background:#1c1c1e;}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.hint{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:14px;background:#f2f2f7;border-radius:12px;padding:10px 12px}
[data-theme="dark"] .hint{background:#2c2c2e;}
.hint b{color:#475069}
[data-theme="dark"] .hint b{color:var(--ink);}
.hint code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--brand)}
[data-theme="dark"] .hint code{background:#1c1c1e;}
.roomcode-big{font-size:46px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--brand);margin:6px 0 2px;font-family:-apple-system,BlinkMacSystemFont,"SF Mono",ui-monospace,monospace}
.share{text-align:center;font-size:13px;color:var(--sub)}
.share code{background:#f1f4fb;padding:3px 9px;border-radius:7px;color:#374151;font-size:12.5px;word-break:break-all}
[data-theme="dark"] .share code{background:#2c2c2e;color:var(--ink)}
.copybtn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:9px;padding:6px 14px;font-size:12.5px;cursor:pointer;margin-top:9px;font-weight:600;transition:transform .12s var(--ease)}
[data-theme="dark"] .copybtn{background:#1c1c1e;}
.copybtn:active{transform:scale(.96)}
.plist{margin-top:14px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:#f2f2f7;margin-bottom:8px;font-size:15px}
[data-theme="dark"] .prow{background:#2c2c2e;}
.prow .dot{width:8px;height:8px;border-radius:50%;background:#c7c7cc;flex:none}
.prow .dot.on{background:var(--ok)}
.prow .host{color:#d97706;font-size:13px}
.prow .me{color:var(--brand);font-size:12px;background:rgba(0,122,255,.12);border-radius:6px;padding:1px 7px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:30;margin:-20px -16px 16px;padding:11px 16px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:var(--hair)}
.modal .topbar{position:static;margin:0;padding:14px 16px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.chip{background:var(--card);border:var(--hair);border-radius:999px;padding:6px 14px;font-size:13px;color:#3a3a3c;box-shadow:var(--shadow)}
[data-theme="dark"] .chip{color:var(--ink);}
.chip b{color:var(--brand)}
.chip.mode{background:linear-gradient(135deg,rgba(0,122,255,.1),rgba(94,92,230,.1));border-color:rgba(0,122,255,.25)}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.schip{background:var(--card);border-radius:13px;padding:8px 13px;font-size:13.5px;box-shadow:var(--shadow);border:var(--hair);display:flex;align-items:center;gap:7px}
.schip .nm{max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schip .sc{font-weight:800;color:var(--brand)}
.schip.ans .sc{color:var(--ok)}
.schip.ans::after{content:'✓';color:var(--ok);font-weight:800}
.schip .rk{flex:none;width:22px;height:22px;border-radius:50%;background:#e9e9ec;color:var(--sub);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .schip .rk{background:#3a3a3c;}
.schip .rk.r1{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff}
.schip .rk.r2{background:linear-gradient(135deg,#9ca3af,#6b7280);color:#fff}
.schip .rk.r3{background:linear-gradient(135deg,#e8a87c,#c97b4a);color:#fff}
.schip.me{border-color:var(--brand);background:rgba(0,122,255,.07);box-shadow:0 0 0 2px rgba(0,122,255,.18)}
.rankchip b{color:#d97706;font-size:14px}
.qwrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 20px;text-align:center;position:relative;overflow:hidden;border:var(--hair)}
.qmeta{font-size:13px;color:var(--sub);margin-bottom:8px}
.word{font-size:44px;font-weight:700;letter-spacing:.5px;color:var(--ink);margin:10px 0 6px}
.meaning{font-size:18px;color:var(--ok);font-weight:700}
.ipa{font-size:15px;color:var(--sub);margin:2px 0 10px;line-height:1.5;text-align:center;font-family:"Helvetica Neue",Arial,sans-serif}
.ipa-cell{font-size:12.5px;color:var(--sub);font-style:italic;min-width:64px;flex:none;align-self:center;text-align:left}
.ipa-t{font-style:italic}
.ipa-audio{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--brand);font-size:13px;cursor:pointer;vertical-align:middle;margin-left:6px;transition:transform .12s var(--ease)}
.ipa-audio:active{transform:scale(.9)}
.listen-btn{
  width:108px;height:108px;border-radius:50%;border:none;cursor:pointer;margin:14px auto;
  background:var(--brand);color:#fff;font-size:42px;
  box-shadow:0 10px 26px rgba(0,122,255,.40);display:flex;align-items:center;justify-content:center;transition:transform .12s var(--ease), box-shadow .12s var(--ease);
}
.listen-btn:active{transform:scale(.94)}
.listen-tip{font-size:12.5px;color:var(--sub)}
.timerbar{height:7px;background:#eef1f6;border-radius:99px;overflow:hidden;margin:16px 0 4px}
.timerbar i{display:block;height:100%;background:var(--brand);border-radius:99px;width:100%}
.timerbar.danger i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.tsec{text-align:right;font-size:12.5px;color:var(--sub)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:480px){.opts{grid-template-columns:1fr}.word{font-size:34px}}
.opt{
  border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:15px 12px;font-size:15.5px;
  cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;line-height:1.35;outline:none;transition:.15s var(--ease);
}
.opt:hover:not(:disabled){border-color:rgba(0,122,255,.4)}
.opt .k{flex:none;width:26px;height:26px;border-radius:9px;background:#eef1f6;color:var(--sub);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .opt .k{background:#3a3a3c;}
.opt.correct{border-color:var(--ok);background:rgba(52,199,89,.12);font-weight:700}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:rgba(255,59,48,.10)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.picked{border-color:var(--brand);background:rgba(0,122,255,.08)}
.opt:disabled{cursor:default}
.waiting{margin-top:14px;font-size:13.5px;color:var(--sub);text-align:center}
.myfb{margin-top:14px;font-size:15px;font-weight:800;padding:11px 14px;border-radius:12px;animation:pop .3s ease;text-align:center}
.myfb.ok{background:rgba(14,159,110,.13);color:var(--ok)}
.myfb.bad{background:rgba(239,68,68,.1);color:var(--bad)}
.myfb b{font-size:17px}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.gain{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.gain span{font-size:12.5px;border-radius:8px;padding:3px 10px;background:#f3f4f6;color:#4b5563}
.gain span.up{background:rgba(14,159,110,.12);color:var(--ok);font-weight:700}
.gain span.down{background:rgba(239,68,68,.1);color:var(--bad)}
.rank{margin-top:6px}
.rrow{display:flex;align-items:center;gap:12px;background:#f2f2f7;border-radius:14px;padding:13px 15px;margin-bottom:9px}
[data-theme="dark"] .rrow{background:#2c2c2e;}
.rrow.first{background:linear-gradient(135deg,#fff7e6,#fffbea);border:1px solid #fde68a}
.rrow .medal{font-size:24px;width:34px;text-align:center;flex:none}
.rrow .rname{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rstat{text-align:right;font-size:12.5px;color:var(--sub)}
.rrow .rstat b{display:block;font-size:19px;color:var(--brand)}
.rrow.first .rstat b{color:#d97706}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111827;color:#fff;
  padding:10px 20px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
  max-width:86vw;text-align:center;
}
.toast.show{opacity:.95}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.logo .ic{font-size:30px}
.footer-tip{text-align:center;color:#9ca3af;font-size:12px;margin-top:26px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.speak-flash{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(0,122,255,.4)}50%{box-shadow:0 10px 40px rgba(0,122,255,.7)}}
/* ---------- 首页功能入口 ---------- */
.feat{display:flex;flex-direction:column;gap:0;padding:18px}
.feat .btn{margin-top:0;padding:13px 6px;font-size:14.5px}
.feat-grid .feat{animation:cardIn .45s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:480px){.feat{grid-template-columns:1fr}}
/* ---------- 生词本 ---------- */
.wb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.wb-count{font-size:13px;color:var(--sub)}
.wrow{display:flex;align-items:center;gap:10px;background:#f2f2f7;border-radius:13px;padding:11px 13px;margin-bottom:8px}
[data-theme="dark"] .wrow{background:#2c2c2e;}
.wrow .w{font-weight:800;font-size:16px;min-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .m{flex:1;font-size:13.5px;color:#374151;line-height:1.4}
[data-theme="dark"] .wrow .m{color:var(--sub);}
.wrow .b{flex:none;font-size:11.5px;color:var(--sub);background:#e9e9ec;border-radius:6px;padding:2px 7px}
[data-theme="dark"] .wrow .b{background:#3a3a3c;}
.wrow .del{flex:none;border:none;background:rgba(255,59,48,.12);color:var(--bad);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.wrow .del:active{transform:scale(.96)}
.wrow .kw{flex:none;border:none;background:rgba(48,209,88,.14);color:var(--ok);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.wrow .kw:active{transform:scale(.96)}
.wb-empty{text-align:center;color:var(--sub);font-size:14px;padding:26px 0 10px;line-height:1.8}
/* ---------- 词汇量自测 ---------- */

<script src="/books.bundle.js"></script>
<script>
'use strict';
var $ = function(s){ return document.querySelector(s); };
var app = $('#app');

/* ---------- 全局状态 ---------- */
var BOOKS = [];
var INFO = { ips: [], port: 3000 };
var token = localStorage.getItem('vpk_token') || '';   // 登录令牌
var account = null;     // {username, name} 当前登录账号
var session = null;      // {roomId, playerId}
var es = null;           // EventSource
var cur = null;          // 最近一次房间状态
var page = 'home';       // auth | home | room | wrongbook | vocab
var wrongList = [];      // 生词本数据
var vq = null;           // 词汇量测试状态 {questions, tiers, idx, answers, phase}
/* 按词书 id 查语言（en/es），用于朗读发音 */
function bookLangOf(id){
  for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].id === id) return BOOKS[i].lang || 'en';
  return 'en';
}
var LANG_NAMES = { en: '英语', es: '西班牙语' };
/* 按语言分组的词书下拉选项（英语 / 西班牙语） */
function bookOptionsHTML(selectedId, list){
  var src = list && list.length ? list : BOOKS;
  var langs = [];
  src.forEach(function(b){ var ln = b.lang || 'en'; if (langs.indexOf(ln) < 0) langs.push(ln); });
  return langs.map(function(ln){
    var items = src.filter(function(b){ return (b.lang || 'en') === ln; }).map(function(b){
      var tag = b.custom ? ' ★' : '';
      return '<option value="' + esc(b.id) + '"' + (b.id === selectedId ? ' selected' : '') + '>' + esc(b.name) + '（' + b.count + '词）' + tag + '</option>';
    }).join('');
    return langs.length > 1 ? '<optgroup label="' + (LANG_NAMES[ln] || ln) + '">' + items + '</optgroup>' : items;
  }).join('');
}
var clockOffset = 0;     // 服务器时钟偏移
var rafId = null;
var lastSpokenQ = -1;
var myLocalPick = null;   // 点击瞬间的本地高亮选项（服务器确认前兜底）
var lastPickQ = -1;       // 本地高亮对应的题号
var myLocalCorrect = null;   // 本地即时判题结果（null=未判定，true/false=已判定）
var myLocalCorrectIdx = -1;  // 本地判定的正确选项位置
var _bk = null;           // 已解码的本地词书
var _bkReady = false;     // 本地词书是否已就绪（支持 DecompressionStream 且解码成功）

/* ---------- 基础函数 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- 本地词书（答案内置浏览器，防 F12 直读；老浏览器自动降级为服务器判题） ---------- */
var _BK_KEY = String.fromCharCode(86,79,67,65,66,80,75,95,83,51,67,82,69,84,95,75,69,89); // VOCABPK_S3CRET_KEY
function decodeBooks(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ _BK_KEY.charCodeAt(i % _BK_KEY.length);
  var ds = new DecompressionStream('deflate');
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Response(stream).arrayBuffer().then(function(buf){
    return JSON.parse(new TextDecoder('utf-8').decode(buf));
  });
}
function loadLocalBooks(){
  if (_bkReady) return Promise.resolve(_bk);
  if (!window.__VOCAB_BOOKS__) return Promise.resolve(null);
  try {
    return decodeBooks(window.__VOCAB_BOOKS__).then(function(books){
      _bk = books; _bkReady = true; return books;
    }).catch(function(){ _bkReady = true; _bk = null; return null; });
  } catch (e) {
    return Promise.resolve(null); // DecompressionStream 不可用 → 保持服务器判题
  }
}
// 本地判题：在词书里查 word 的释义，返回其在选项中的位置；查不到返回 -1
function localCorrectIdx(word, bookId, options){
  if (!_bk || !word || !options || !options.length) return -1;
  var list = null;
  if (bookId) {
    for (var i = 0; i < _bk.length; i++) if (_bk[i].id === bookId) { list = _bk[i].words; break; }
  }
  var meaning = null;
  if (list) {
    for (var j = 0; j < list.length; j++) if (list[j][0] === word) { meaning = list[j][1]; break; }
  }
  if (meaning === null) { // 兜底：整库查找
    for (var a = 0; a < _bk.length && meaning === null; a++) {
      var wl = _bk[a].words;
      for (var b = 0; b < wl.length; b++) if (wl[b][0] === word) { meaning = wl[b][1]; break; }
    }
  }
  if (meaning === null) return -1;
  return options.indexOf(meaning);
}
function applyLocalJudge(v){
  if (!v || !v.question) return;
  var lc = localCorrectIdx(v.question.word, v.settings && v.settings.bookId, v.question.options);
  if (lc >= 0) {
    myLocalCorrect = (myLocalPick === lc);
    myLocalCorrectIdx = lc;
    renderGame(v);
  }
}

function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function copyText(txt, okMsg){
  function fallback(){
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast(okMsg || '已复制');
    } catch (e) { toast('复制失败，请手动复制'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg || '已复制'); }, fallback);
  } else fallback();
}
function api(path, body, method){
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token; // L1：令牌走请求头，避免进入 URL/浏览器历史/服务器日志
  return fetch(path, {
    method: method || (body ? 'POST' : 'GET'),
    headers: headers,
    body: body ? JSON.stringify(body) : undefined,
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok || d.error) throw new Error(d.error || ('请求失败 ' + r.status));
      return d;
    });
  });
}
/* ---------- 发音：优先浏览器 TTS，无语音包/不支持时自动回退在线 MP3（适配安卓自带浏览器） ---------- */
var _voices = [];
function _refreshVoices(){ try { if ('speechSynthesis' in window) { var v = speechSynthesis.getVoices(); if (v && v.length) _voices = v; } } catch (e) {} }
_refreshVoices();
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = _refreshVoices; }
var _ttsBroken = false;   // 浏览器 TTS 已确认不可用 → 之后直接走 MP3
var _audioEl = null;
function _getAudio(){ if (!_audioEl) { _audioEl = new Audio(); _audioEl.preload = 'auto'; } return _audioEl; }
function _mp3Urls(word, lang){
  var q = encodeURIComponent(word);
  var tl = (lang === 'es') ? 'es' : 'en';
  var urls = ['https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&total=1&idx=0&textlen=64&tl=' + tl + '&q=' + q];
  if (lang !== 'es') urls.push('https://dict.youdao.com/dictvoice?le=en&type=2&audio=' + q);
  return urls;
}
function _playMp3(word, lang){
  var urls = _mp3Urls(word, lang);
  var a = _getAudio();
  var i = 0;
  function tryNext(){
    if (i >= urls.length) { toast('当前浏览器发音受限，点 🔊 可重试，或换 Chrome/Edge'); return; }
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    a.src = urls[i++];
    var p = a.play();
    if (p && p.catch) p.catch(function(){ tryNext(); });
    a.onerror = function(){ tryNext(); };
  }
  tryNext();
}
function speak(word, lang){
  lang = (lang === 'es') ? 'es' : 'en';
  word = String(word || '').trim();
  if (!word) return;
  // 1) 浏览器 TTS：有语音包才用（小米/华为/vivo 等自带浏览器常无语音包，speak 会静默失败）
  try {
    if (!_ttsBroken && 'speechSynthesis' in window) {
      _refreshVoices();
      if (_voices.length) {
        var u = new SpeechSynthesisUtterance(word);
        u.lang = (lang === 'es') ? 'es-ES' : 'en-US';
        u.rate = 0.85;
        var want = (lang === 'es') ? /^es(-|_)/i : /^en(-|_)US/i;
        var loose = (lang === 'es') ? /^es/i : /^en/i;
        var v = null;
        for (var i = 0; i < _voices.length; i++) if (want.test(_voices[i].lang)) { v = _voices[i]; break; }
        if (!v) for (var j = 0; j < _voices.length; j++) if (loose.test(_voices[j].lang)) { v = _voices[j]; break; }
        if (v) u.voice = v;
        u.onerror = function(){ _ttsBroken = true; _playMp3(word, lang); };
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
        return;
      }
    }
  } catch (e) { _ttsBroken = true; }
  // 2) 回退：在线 TTS MP3（Google，支持英/西；失败再试有道）
  _playMp3(word, lang);
}
/* 首次用户手势时解锁 <audio>，绕过安卓自带浏览器的自动播放限制 */
document.addEventListener('pointerdown', function _unlockAudio(){
  document.removeEventListener('pointerdown', _unlockAudio);
  try {
    var a = _getAudio();
    a.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=';
    var p = a.play();
    if (p && p.catch) p.catch(function(){});
  } catch (e) {}
}, { once: true });

/* ---------- SSE + 轮询兜底 ---------- */
var pollTimer = null;   // 轮询定时器
var sseAlive = false;   // 是否已通过 SSE 收到过数据
var lastStateStr = '';  // 最近一次渲染的状态（排除 serverNow），用于轮询去重
function applyState(v){
  try {
    clockOffset = v.serverNow - Date.now();
    cur = v;
    if (page === 'room') {
      // 轮询每秒一次，但只有状态真正变化才重渲染（避免 DOM 重建吞掉用户点击）
      var s = JSON.stringify(v, function(k, val){ return k === 'serverNow' ? 0 : val; });
      if (s !== lastStateStr) { lastStateStr = s; render(); }
    }
  } catch (err) {}
}
function startPolling(roomId, playerId){
  if (pollTimer) return;
  pollTimer = setInterval(function(){
    fetch('/api/state?roomId=' + encodeURIComponent(roomId) + '&playerId=' + encodeURIComponent(playerId))
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && !d.error) applyState(d); })
      .catch(function(){});
  }, 1000);
}
function stopPolling(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function connect(roomId, playerId){
  if (es) { es.close(); es = null; }
  sseAlive = false;
  lastStateStr = '';
  es = new EventSource('/api/stream?roomId=' + encodeURIComponent(roomId) + '&playerId=' + encodeURIComponent(playerId));
  es.onmessage = function(e){
    try {
      sseAlive = true;
      stopPolling(); // SSE 正常工作，停掉轮询兜底
      applyState(JSON.parse(e.data));
    } catch (err) {}
  };
  // 4 秒内 SSE 没收到首帧（网络缓冲了事件流）→ 自动降级为轮询
  setTimeout(function(){
    if (!sseAlive && session && session.roomId === roomId) startPolling(roomId, playerId);
  }, 4000);
  es.onerror = function(){
    if (es && es.readyState === 2) {
      // 服务器断开：EventSource 会自动重连；期间由轮询兜底保证状态更新
      if (session && session.roomId === roomId) startPolling(roomId, playerId);
    }
  };
}
function leaveRoom(){
  if (es) { es.close(); es = null; }
  stopPolling();
  sseAlive = false;
  lastStateStr = '';
  session = null; cur = null; lastSpokenQ = -1; myLocalPick = null; lastPickQ = -1; myLocalCorrect = null; myLocalCorrectIdx = -1;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  page = 'home';
  renderHome();
}

      app.querySelectorAll('.add-fr').forEach(function(b){
        b.onclick = (function(u){ return function(){
          api('/api/friend', { token: token, username: u }).then(function(){ toast('已添加 @' + u + ' 为好友 🤝'); renderGroupDetail(gid); })

      });

}

/* ---------- 好友选择器（body 浮层，避免 app 重渲染丢失） ---------- */
function showFriendPicker(title, candidates, onPick){
  closeFriendPicker();
  var ov = document.createElement('div'); ov.id = 'pickerOverlay'; ov.className = 'overlay';
  ov.innerHTML = '<div class="modal"><div class="topbar" style="justify-content:space-between"><span class="chip">' + esc(title) + '</span><button class="copybtn" id="pkClose">关闭</button></div><div id="pkList" class="cb-list"></div></div>';
  document.body.appendChild(ov);
  var list = $('#pkList');
  if (!candidates || !candidates.length) list.innerHTML = '<div class="wb-empty">没有可邀请的好友</div>';
  else list.innerHTML = candidates.map(function(f){ return '<div class="cb-row"><span class="nm">' + esc(f.name) + ' <small>@' + esc(f.username) + '</small></span><button class="copybtn pk-pick" data-u="' + esc(f.username) + '">选择</button></div>'; }).join('');
  $('#pkClose').onclick = closeFriendPicker;
  ov.onclick = function(e){ if (e.target === ov) closeFriendPicker(); };
  list.querySelectorAll('.pk-pick').forEach(function(b){ b.onclick = function(){ closeFriendPicker(); onPick(b.getAttribute('data-u')); }; });
}
function closeFriendPicker(){ var o = $('#pickerOverlay'); if (o) o.remove(); }
function inviteFriendToPk(username){
  function doInvite(roomId, playerId){
    api('/api/pk/invite', { token: token, roomId: roomId, playerId: playerId, toUsername: username })
      .then(function(){ toast('已邀请 @' + username + ' 进入房间'); })
      .catch(function(e){ toast(e.message); });
  }
  if (session && session.roomId) { doInvite(session.roomId, session.playerId); return; }
  api('/api/create', { token: token, bookId: '', mode: 'word', count: 20 })
    .then(function(d){ session = { roomId: d.roomId, playerId: d.playerId }; page = 'room'; connect(d.roomId, d.playerId); doInvite(d.roomId, d.playerId); })
    .catch(function(e){ toast(e.message); });
}

/* ---------- PK 邀请接收（全局轮询横幅） ---------- */
var inviteTimer = null, shownInviteId = null;
function startInviteWatcher(){ if (inviteTimer) return; inviteTimer = setInterval(checkInvites, 8000); checkInvites(); }
function stopInviteWatcher(){ if (inviteTimer) { clearInterval(inviteTimer); inviteTimer = null; } }
function checkInvites(){
  if (!token) return;
  api('/api/invites', null, 'GET').then(function(d){
    var list = d.invites || [];
    if (!list.length) { hideInviteBanner(); return; }
    var inv = list[0];
    if (inv.id === shownInviteId) return;
    shownInviteId = inv.id;
    showInviteBanner(inv);
  }).catch(function(){});
}
function showInviteBanner(inv){
  var b = $('#inviteBanner');
  if (!b) { b = document.createElement('div'); b.id = 'inviteBanner'; b.className = 'invite-banner'; document.body.appendChild(b); }
  b.innerHTML = '<div class="ib-text">⚡ <b>' + esc(inv.fromName) + '</b> 邀请你单词对战（' + esc(inv.bookName) + '）</div>' +
    '<button class="btn" id="ibJoin">加入房间 ' + esc(inv.roomId) + '</button>' +
    '<button class="copybtn" id="ibIgnore">忽略</button>';
  b.style.display = 'flex';
  $('#ibJoin').onclick = function(){
    b.style.display = 'none';
    api('/api/invite?id=' + encodeURIComponent(inv.id), null, 'DELETE').catch(function(){});
    api('/api/join', { token: token, roomId: inv.roomId }).then(function(d){ session = { roomId: d.roomId, playerId: d.playerId }; page = 'room'; connect(d.roomId, d.playerId); })
      .catch(function(e){ toast(e.message); });
  };
  $('#ibIgnore').onclick = function(){
    api('/api/invite?id=' + encodeURIComponent(inv.id), null, 'DELETE').catch(function(){});
    b.style.display = 'none'; shownInviteId = null;
  };
}
function hideInviteBanner(){ var b = $('#inviteBanner'); if (b) b.style.display = 'none'; }

      '· 单词从「中考 → 高考 → 四级 → 六级 → 考研 → 雅思 → 托福」逐层随机出现；<br>' +
      '· 认识的词选「✅ 认识」并挑出正确释义（选对才计认识）；<br>' +
      '· 认识但释义选错 = 拿不准，算一半；完全没见过就选「❌ 不认识」；<br>' +
      '· 按每层认识比例估算该层词数，累加得总词汇量，成绩自动保存在你的账号。' +
    '</div>' +
    '<button class="btn" id="vtStart">开始测试 🚀</button>' +
    '<button class="btn ghost" id="vtBack">返回首页</button>' +
  '</div>';
  $('#vtStart').onclick = function(){
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>出题中…';
    api('/api/vocabtest/questions')
      .then(function(d){
        vq = { questions: d.questions, tiers: d.tiers, idx: 0, answers: [], phase: 'q' };
        renderVocabQ();
      })
      .catch(function(e){ toast(e.message); btn.disabled = false; btn.innerHTML = '开始测试 🚀'; });
  };
  $('#vtBack').onclick = function(){ page = 'home'; renderHome(); };
}

function renderVocabQ(){
  if (!vq) { renderVocabStart(); return; }
  var q = vq.questions[vq.idx];
  var tierName = vq.tiers[q.tier] ? vq.tiers[q.tier].name : '';
  var isVerify = vq.phase === 'verify';
  var letters = ['A','B','C','D'];
  app.innerHTML =
  '<h1>📊 词汇量自测</h1>' +
  '<div class="card" style="text-align:center">' +
    '<div class="vt-progress">第 ' + (vq.idx + 1) + ' / ' + vq.questions.length + ' 题 · ' + esc(tierName) + ' 难度</div>' +
    (isVerify ? '' : '<div class="word" style="margin-top:4px">' + esc(q.word) + '</div>') +
    (isVerify
      ? '<div class="vt-verify-tip">这个词你认识吗？选出正确释义<br>（认识但选错 = 拿不准，算一半）</div>' +
        '<div class="opts">' + q.options.map(function(o, i){
          return '<button class="opt" data-i="' + i + '"><span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
        }).join('') + '</div>'
      : '<div class="vt-btns">' +
          '<button class="yes" id="vtYes">✅ 认识</button>' +
          '<button class="no" id="vtNo">❌ 不认识</button>' +
        '</div>') +
  '</div>' +
  '<div class="card" style="padding:14px"><button class="btn ghost" id="vtQuit">退出测试</button></div>';

  function next(credit){
    vq.answers.push({ word: q.word, tier: q.tier, credit: credit });
    vq.idx += 1;
    if (vq.idx >= vq.questions.length) { vq.phase = 'done'; renderVocabResult(); }
    else { vq.phase = 'q'; renderVocabQ(); }
  }
  if (isVerify) {
    app.querySelectorAll('.opt').forEach(function(btn){
      btn.onclick = function(){
        var i = +btn.getAttribute('data-i');
        next(i === q.correctIndex ? 1 : 0.5);
      };
    });
  } else {
    $('#vtYes').onclick = function(){ vq.phase = 'verify'; renderVocabQ(); };
    $('#vtNo').onclick = function(){ next(0); };
  }
  $('#vtQuit').onclick = function(){ vq = null; page = 'home'; renderHome(); };
}

function renderVocabResult(){
  var name = account ? account.username : '';
  var counts = {};
  vq.answers.forEach(function(a){ counts[a.tier] = (counts[a.tier] || 0) + 1; });
  var countsArr = (vq.tiers || []).map(function(_, i){ return counts[i] || 0; });
  app.innerHTML = '<h1>📊 正在测算…</h1><div class="tagline"><span class="spin"></span></div>';
  api('/api/vocabtest/submit', { token: token, answers: vq.answers, counts: countsArr })
    .then(function(d){
      var maxE = Math.max.apply(null, d.estimates.map(function(t){ return t.value; }).concat([1]));
      var tiersHtml = d.estimates.map(function(t){
        var pct = Math.round(t.value / maxE * 100);
        return '<div class="vt-tier"><span class="tn">' + esc(t.tier) + '</span>' +
          '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
          '<span class="tv">' + t.value + '</span></div>';
      }).join('');
      app.innerHTML =
      '<h1>📊 测试完成</h1>' +
      '<div class="card" style="text-align:center">' +
        '<div class="vt-est">≈ ' + d.estimate.toLocaleString() + '</div>' +
        '<div class="vt-est-label">你的估算词汇量（各层认识比例 × 该层词数）</div>' +
        tiersHtml +
      '</div>' +
      '<div class="card" style="padding:14px">' +
        '<button class="btn" id="vtAgain">再测一次 🔁</button>' +
        '<button class="btn ghost" id="vtDone">返回首页</button>' +
      '</div>';
      $('#vtAgain').onclick = function(){ renderVocabStart(); };
      $('#vtDone').onclick = function(){ vq = null; page = 'home'; renderHome(); };
    })
    .catch(function(e){ toast(e.message); renderVocabStart(); });
}

/* ---------- 单词音标（运行时拉取 dictionaryapi.dev，本地缓存） ---------- */
var IPA_CACHE = {};
try { IPA_CACHE = JSON.parse(localStorage.getItem('vpk_ipa') || '{}'); } catch (e) { IPA_CACHE = {}; }
function saveIpaCache(){ try { localStorage.setItem('vpk_ipa', JSON.stringify(IPA_CACHE)); } catch (e) {} }
function fetchIPA(word, lang, cb){
  var key = (lang || 'en') + ':' + String(word).toLowerCase();
  if (Object.prototype.hasOwnProperty.call(IPA_CACHE, key)) { cb(IPA_CACHE[key]); return; }
  if (lang === 'es') { // dictionaryapi.dev 暂不支持西班牙语，留空
    IPA_CACHE[key] = null; saveIpaCache(); cb(null); return;
  }
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()))
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      var ipa = null, audio = null;
      if (d && d[0]) {
        if (d[0].phonetic) ipa = d[0].phonetic;
        var phs = d[0].phonetics || [];
        for (var i = 0; i < phs.length; i++) {
          if (!ipa && phs[i].text) ipa = phs[i].text;
          if (!audio && phs[i].audio) audio = phs[i].audio;
        }
      }
      var val = ipa ? { ipa: ipa, audio: audio } : null;
      IPA_CACHE[key] = val; saveIpaCache(); cb(val);
    })
    .catch(function(){ IPA_CACHE[key] = null; saveIpaCache(); cb(null); });
}

/* 打乱学习题选项顺序：正确答案文本恒为 q.meaning，仅改变其在 A/B/C/D 中的位置，
   使同一词在错题重排再次出现时正确项位置不再固定（避免死记位置而非意思） */
function shuffleStuOptions(q) {
  var arr = (q.options || []).map(function(o){ return { o: o, correct: o === q.meaning }; });
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  q.options = arr.map(function(x){ return x.o; });
  for (var k = 0; k < arr.length; k++) if (arr[k].correct) { q.correctIndex = k; break; }
}

/* 为列表中的单词异步填充音标（并发受限，避免一次性几百个网络请求被限流）；命中本地缓存的同步填充不递归 */
function fillIpaCells(scope) {
  var cells = Array.prototype.slice.call((scope || document).querySelectorAll('.ipa-cell'));
  var pending = [];
  for (var i = 0; i < cells.length; i++) {
    var el = cells[i];
    var w = el.getAttribute('data-ipa-w'), l = el.getAttribute('data-ipa-l');
    var key = (l || 'en') + ':' + String(w).toLowerCase();
    if (l === 'es') continue; // 西语无音标，跳过
    if (Object.prototype.hasOwnProperty.call(IPA_CACHE, key) && IPA_CACHE[key] && IPA_CACHE[key].ipa) {
      el.textContent = IPA_CACHE[key].ipa; // 命中缓存：同步填，不递归、不请求
    } else {
      pending.push(el);
    }
  }
  var MAX = 8, running = 0, p = 0;
  function launch() {
    while (p < pending.length && running < MAX) {
      var el = pending[p++]; running++;
      var w = el.getAttribute('data-ipa-w'), l = el.getAttribute('data-ipa-l');
      fetchIPA(w, l, (function(cell){
        return function(res){ if (res && res.ipa) cell.textContent = res.ipa; running--; launch(); };
      })(el));
    }
  }
  launch();
}

/* 拼写题：看释义写词，提交后比对 */
function stuSpellSubmit(){
  var s = stu.sess; if (!s || s.lock) return;
  var q = s.queue[s.idx]; if (!q) return;
  var inp = $('#sqInput'); if (!inp) return;
  var val = inp.value.trim().toLowerCase();
  if (!val) { toast('请先输入单词'); return; }
  var correct = val === String(q.word).trim().toLowerCase();
  var fb = $('#sqFb');
  if (fb) fb.innerHTML = correct
    ? '<div class="sfb ok">🎉 拼写正确！</div>'
    : '<div class="sfb bad">😅 拼写有误<small>正确拼写：' + esc(q.word) + '</small></div>';
  inp.classList.add(correct ? 'ok' : 'bad');
  s.lock = true;
  s.marks[s.idx] = correct;
  if (correct) s.right += 1; else s.wrong += 1;
  if (!correct) {
    if (!s.wrongWords.some(function(w){ return w.word === q.word; })) s.wrongWords.push({ word: q.word, meaning: q.meaning, my: val });
  }
  api('/api/study/answer', { token: token, word: q.word, correct: correct, ms: q._shownAt ? (Date.now() - q._shownAt) : 0 }, 'POST')
    .then(function(d){ if (d.mastered && !d.removed) toast('「' + q.word + '」已达到掌握等级 🎓'); })
    .catch(function(){});
  setTimeout(function(){
    if (!stu.sess || stu.sess !== s) return;
    s.lock = false;
    s.idx += 1;
    if (s.idx >= s.queue.length) renderStuSummary();
    else renderStuQuestion();
  }, correct ? 900 : 1900);
}
/* 标记为已会：直接移入熟词本并跳过本题 */
function stuMarkKnown(word){
  var s = stu.sess; if (!s || s.lock) return;
  s.lock = true;
  s.marks[s.idx] = true;
  api('/api/study/markKnown', { token: token, word: word }, 'POST')
    .then(function(){
      toast('已移入熟词本 📗');
      s.lock = false;
      s.idx += 1;
      if (s.idx >= s.queue.length) renderStuSummary();
      else renderStuQuestion();
    })
    .catch(function(e){ s.lock = false; toast(e.message); });
}
function stuPick(choice){
  var s = stu.sess;
  if (!s || s.lock) return;
  var q = s.queue[s.idx];
  if (!q) return;
  s.lock = true;
  var correct = choice === q.correctIndex;
  var letters = ['A', 'B', 'C', 'D'];
  app.querySelectorAll('#sqOpts .opt').forEach(function(btn){
    var i = +btn.getAttribute('data-i');
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add('correct');
    else if (i === choice) btn.classList.add('wrong');
  });
  s.marks[s.idx] = correct;
  if (correct) s.right += 1; else s.wrong += 1;
  if (!correct) {
    if (!s.wrongWords.some(function(w){ return w.word === q.word; })) s.wrongWords.push({ word: q.word, meaning: q.meaning, my: q.options[choice] });
    // 答错重排：3 题之后（或最后）再考一次，最多重排 2 次
    q._rq = (q._rq || 0) + 1;
    if (q._rq <= 2) {
      var at = Math.min(s.queue.length, s.idx + 4);
      s.queue.splice(at, 0, q);
    }
  }
  var fb = $('#sqFb');
  if (fb) fb.innerHTML = correct
    ? '<div class="sfb ok">🎉 答对了！<small>' + esc(q.word) + ' · ' + esc(q.meaning) + '</small></div>'
    : '<div class="sfb bad">😅 答错了<small>正确释义：' + esc(q.meaning) + (q._rq <= 2 ? ' · 稍后再考你一次' : '') + '</small></div>';
  api('/api/study/answer', { token: token, word: q.word, correct: correct, ms: q._shownAt ? (Date.now() - q._shownAt) : 0 }, 'POST')
    .then(function(d){
      if (d.removed) toast('「' + q.word + '」已连续答对 5 次，从生词本毕业 🎓');
      if (d.mastered && !d.removed) toast('「' + q.word + '」已达到掌握等级 🎓');
    })
    .catch(function(){});
  setTimeout(function(){
    if (!stu.sess || stu.sess !== s) return;
    s.lock = false;
    s.idx += 1;
    if (s.idx >= s.queue.length) renderStuSummary();
    else renderStuQuestion();
  }, correct ? 900 : 1900);
}
function stuQuit(){
  var s = stu.sess;
  if (!s) { renderStudy(); return; }
  var done = s.right + s.wrong;
  if (done > 0 && !confirm('已答 ' + done + ' 题，退出后本组剩余的词下次再来。确定退出？')) return;

      });
      app.querySelectorAll('.cb-row .del').forEach(function(b){
        b.onclick = function(){
          var id = b.getAttribute('data-del');
          if (!confirm('删除这本词书？以其为计划的安排也会被取消。')) return;
          api('/api/custombook?id=' + encodeURIComponent(id), null, 'DELETE')
            .then(function(){ toast('已删除'); renderCustomBooks(); })
            .catch(function(e){ toast(e.message); });
        };
      });
      app.querySelectorAll('.cb-row .copybtn').forEach(function(b){
        b.onclick = function(){
          var id = b.getAttribute('data-use');
          var btn = b; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
          api('/api/study/plan', { token: token, bookId: id, dailyNew: 20, vocabEstimate: 0, autoSpeak: true }, 'POST')
            .then(function(){ toast('已设为学习计划，开始背吧 🚀'); page = 'study'; renderStudy(); })
            .catch(function(e){ toast(e.message); btn.disabled = false; btn.innerHTML = '设为计划'; });
        };
      });
      $('#cbCreate').onclick = function(){
        var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>创建中…';
        var name = ($('#cbName') ? $('#cbName').value : '').trim();
        var text = $('#cbText') ? $('#cbText').value : '';
        api('/api/custombook', { token: token, name: name, lang: lang2, text: text }, 'POST')
          .then(function(dd){
            toast('已创建「' + dd.name + '」（' + dd.count + ' 词）');
            btn.disabled = false; btn.innerHTML = '创建词书 📚';
            $('#cbText').value = '';
            renderCustomBooks();
          })
          .catch(function(e){ toast(e.message); btn.disabled = false; btn.innerHTML = '创建词书 📚'; });
      };
      $('#backHome').onclick = function(){ page = 'study'; renderStudy(); };
    })
    .catch(function(e){ toast(e.message); page = 'study'; renderStudy(); });
}
/* ---------- 整账户备份 / 恢复 ---------- */
function exportBackup(){
  api('/api/backup', null, 'GET')
    .then(function(d){
      var data = d.backup || {};
      data.app = 'vocab-pk'; data.version = 1;
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'beitaomiao-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      toast('备份已导出 📤');
    })
    .catch(function(e){ toast(e.message); });
}
function importBackup(){
  if (!confirm('导入备份将覆盖当前的生词本、熟词本、自定义词书与学习进度。确定继续？')) return;
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var data = JSON.parse(rd.result);
        api('/api/restore', { token: token, backup: data }, 'POST')
          .then(function(){ toast('备份已恢复 📥'); page = 'study'; renderStudy(); })
          .catch(function(e){ toast(e.message); });
      } catch (err) { toast('文件不是有效的 JSON 备份'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
/* 学习页键盘快捷键：1-4 选择选项 */

  }

/* ---------- 大厅 ---------- */
function renderLobby(v){
  var meHost = false;
  var playerRows = v.players.map(function(p){
    if (p.id === v.you) meHost = p.isHost;
    return '<div class="prow"><span class="dot ' + (p.connected ? 'on' : '') + '"></span>' +
      esc(p.name) + (p.isHost ? ' <span class="host">👑 房主</span>' : '') +
      (p.id === v.you ? ' <span class="me">我</span>' : '') +
      '</div>';
  }).join('');
  var ipHtml = INFO.ips && INFO.ips.length
    ? INFO.ips.map(function(ip){ return '<code>http://' + esc(ip) + ':' + INFO.port + '</code>'; }).join(' 或 ')
    : '<code>http://本机IP:' + INFO.port + '</code>';
  var modeName = v.settings.mode === 'listen' ? '🎧 听音辨义' : '📖 看词选义';

      '<button class="copybtn" id="copyLinkBtn">📋 复制网址 + 房间号</button>'
    : '朋友连<b>同一个 WiFi</b> 后打开 ' + ipHtml + '<br>输入这个房间号即可加入';
  app.innerHTML =
  '<div class="card" style="text-align:center">' +
    '<div class="qmeta">房间号 · 告诉你的朋友</div>' +
    '<div class="roomcode-big">' + esc(v.roomId) + '</div>' +
    '<div class="share">' + shareHtml + '</div>' +
  '</div>' +
  '<div class="card">' +
    '<div class="topbar">' +
      '<span class="chip mode">' + modeName + '</span>' +
      '<span class="chip">' + esc(v.bookName) + '</span>' +
      '<span class="chip">' + v.settings.count + ' 题</span>' +
      '<span class="chip">👥 <b>' + v.players.length + '</b> / 5 人</span>' +

      : '<div class="waiting">等待房主开始… 👀</div>') +

    sb.disabled = true; sb.innerHTML = '<span class="spin"></span>准备中…';
    api('/api/start', { roomId: session.roomId, playerId: session.playerId })
      .catch(function(e){ toast(e.message); sb.disabled = false; sb.innerHTML = '开始对战 🐱'; });
  };
  var clb = $('#copyLinkBtn');
  if (clb) clb.onclick = function(){
    copyText('单词对战地址：' + location.origin + '（房间号 ' + v.roomId + '）', '网址和房间号已复制');
  };
  $('#backBtn').onclick = leaveRoom;
  var ivb = $('#inviteBtn');
  if (ivb) ivb.onclick = function(){
    api('/api/friends', null, 'GET').then(function(d){
      showFriendPicker('邀请好友进房间', d.friends || [], function(un){
        api('/api/pk/invite', { token: token, roomId: session.roomId, playerId: session.playerId, toUsername: un })
          .then(function(){ toast('已邀请 @' + un); }).catch(function(e){ toast(e.message); });
      });

/* ---------- 对战 ---------- */
function renderGame(v){
  var q = v.question || {};
  var isListen = v.settings.mode === 'listen';
  var players = v.players.slice().sort(function(a,b){ return b.score - a.score || b.correctCount - a.correctCount; });
  var myRank = 1;
  for (var ri = 0; ri < players.length; ri++) { if (players[ri].id === v.you) { myRank = ri + 1; break; } }
  var scoreChips = players.map(function(p, idx){
    var isMe = p.id === v.you;
    return '<div class="schip ' + (p.answered ? 'ans' : '') + (isMe ? ' me' : '') + '" title="' + esc(p.name) + '">' +
      '<span class="rk r' + Math.min(idx + 1, 3) + '">' + (idx + 1) + '</span>' +
      '<span class="nm">' + esc(p.name) + (isMe ? '（我）' : '') + '</span>' +
      '<span class="sc">' + p.score + '</span></div>';
  }).join('');
  // 本地乐观高亮：换题时清空；服务器已确认的选择优先
  if (lastPickQ !== v.qIndex) { myLocalPick = null; myLocalCorrect = null; myLocalCorrectIdx = -1; lastPickQ = v.qIndex; }
  var serverChoice = (q.myChoice !== null && q.myChoice !== undefined) ? q.myChoice : null;
  var myChoice = serverChoice !== null ? serverChoice : myLocalPick;
  var answered = v.phase === 'question' && myChoice !== null;
  // 显示结果：服务器已回传 → 以服务器为准（含分数）；否则用本地即时判定兜底（秒反馈）
  var myRes = null;
  if (answered && q.myCorrect !== undefined && q.myCorrect !== null) {
    myRes = { correct: q.myCorrect, gained: q.myGained, correctIndex: q.correctIndex, choice: myChoice };
  } else if (answered && myLocalCorrect !== null && lastPickQ === v.qIndex) {
    myRes = { correct: myLocalCorrect, gained: null, correctIndex: myLocalCorrectIdx, choice: myLocalPick };
  }
  var letters = ['A','B','C','D'];

  var centerHtml;
  if (v.phase === 'question') {
    if (isListen) {
      centerHtml = '<button class="listen-btn speak-flash" id="replayBtn" title="点击重听">🔊</button>' +
        '<div class="listen-tip">正在播放单词读音 · 点喇叭可重听</div>';
    } else {
      centerHtml = '<div class="word">' + esc(q.word) + '</div>';
    }
  } else {
    centerHtml = '<div class="word">' + esc(q.word) + '</div>' +
      '<div class="meaning">✔ ' + esc(q.options[v.lastResult ? v.lastResult.correctIndex : 0]) + '</div>';
  }

  var optsHtml = (q.options || []).map(function(o, i){
    var cls = 'opt';
    var dis = (v.phase === 'reveal') || answered;
    if (v.phase === 'reveal') {
      var lr = v.lastResult;
      if (lr && i === lr.correctIndex) cls += ' correct';
      else if (lr && lr.results[v.you] && lr.results[v.you].choice === i) cls += ' wrong';
      else if (lr && i === myChoice) cls += ' picked';
    } else if (myRes) {
      // 已答：立即标出我的对错（正确项绿 / 我的错项红）
      if (i === myRes.correctIndex) cls += ' correct';
      else if (i === myRes.choice) cls += ' wrong';
    } else if (answered && i === myChoice) {
      cls += ' picked';
    }
    return '<button class="' + cls + '" data-i="' + i + '" ' + (dis ? 'disabled' : '') + '>' +
      '<span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
  }).join('');

  var gainHtml = '';
  if (v.phase === 'reveal' && v.lastResult) {
    gainHtml = '<div class="gain">' + v.players.map(function(p){
      var r = v.lastResult.results[p.id];
      if (!r) return '<span>' + esc(p.name) + ' 未作答</span>';
      return '<span class="' + (r.correct ? 'up' : 'down') + '">' + esc(p.name) + ' ' + (r.correct ? '+' + r.gained : '✗') + '</span>';
    }).join('') + '</div>';
  }

  var waitHtml = '';
  if (v.phase === 'question' && answered) {
    if (myRes) {
      waitHtml = myRes.correct
        ? (myRes.gained != null
            ? '🎉 答对了！+<b>' + myRes.gained + '</b> 分（基础 100 + 速度加成 ' + (myRes.gained - 100) + '）'
            : '🎉 答对了！得分结算中…')
        : '<div class="myfb bad">😅 答错了，正确答案已标绿</div>';
    } else {
      waitHtml = '<div class="waiting">已作答，等待其他玩家…（答得越快加成越高）</div>';
    }
  }
  if (v.phase === 'reveal') {
    waitHtml = '<div class="waiting">下一题马上开始…</div>';
  }

  app.innerHTML =
  '<div class="topbar">' +
    '<span class="chip">房间 <b>' + esc(v.roomId) + '</b></span>' +
    '<span class="chip">' + esc(v.bookName) + '</span>' +
    '<span class="chip mode">' + (isListen ? '🎧 听音辨义' : '📖 看词选义') + '</span>' +
    '<span class="chip">第 <b>' + (v.qIndex + 1) + '</b> / ' + v.total + ' 题</span>' +
    '<span class="chip rankchip">我的排名 <b>#' + myRank + '</b></span>' +
  '</div>' +
  '<div class="scores">' + scoreChips + '</div>' +
  '<div class="qwrap">' +
    '<div class="qmeta">' + (v.phase === 'reveal' ? '本题答案' : (isListen ? '听单词，选出中文意思' : '选出这个单词的中文意思')) + '</div>' +
    centerHtml +
    '<div class="timerbar" id="tbar"><i id="tfill"></i></div>' +
    '<div class="tsec" id="tsec"></div>' +
    '<div class="opts">' + optsHtml + '</div>' +
    waitHtml + gainHtml +
  '</div>';

  // 选项点击
  app.querySelectorAll('.opt').forEach(function(btn){
    btn.onclick = function(){
      if (!session || answered) return;
      answered = true;
      myLocalPick = +btn.getAttribute('data-i');  // 立即本地高亮，不等服务器
      lastPickQ = v.qIndex;
      // 本地即时判题：词书已就绪立即亮对错，否则等词书加载完成（通常已预加载好）
      if (_bkReady) {
        applyLocalJudge(v);
      } else {
        loadLocalBooks().then(function(){
          if (!session || lastPickQ !== v.qIndex) return;
          applyLocalJudge(cur || v);
        });
      }
      api('/api/answer', { roomId: session.roomId, playerId: session.playerId, qIndex: v.qIndex, choice: myLocalPick })
        .catch(function(e){ toast(e.message); });
    };
  });
  var rb = $('#replayBtn');
  if (rb) rb.onclick = function(){ speak(q.word, bookLangOf(v.settings && v.settings.bookId)); };

  // 听力模式自动朗读（每题一次）
  if (v.phase === 'question' && isListen && lastSpokenQ !== v.qIndex) {
    lastSpokenQ = v.qIndex;
    setTimeout(function(){ if (cur && cur.phase === 'question') speak(q.word, bookLangOf(v.settings && v.settings.bookId)); }, 500);
  }

  // 倒计时条
  if (rafId) cancelAnimationFrame(rafId);
  var fill = $('#tfill'), tbar = $('#tbar'), tsec = $('#tsec');
  if (v.phase === 'question' && q.deadline) {
    var dur = q.durationMs || 12000;
    var deadlineLocal = q.deadline - clockOffset;
    function tick(){
      var now = Date.now();
      var remain = Math.max(0, deadlineLocal - now);
      var pct = Math.max(0, Math.min(100, remain / dur * 100));
      if (fill) fill.style.width = pct + '%';
      if (tbar) tbar.classList.toggle('danger', pct < 25);
      if (tsec) tsec.textContent = (remain / 1000).toFixed(1) + ' 秒';
      if (pct > 0 && cur && cur.phase === 'question') rafId = requestAnimationFrame(tick);
    }
    tick();
  } else {
    if (fill) fill.style.width = '0%';
    if (tsec) tsec.textContent = '';
  }
}

/* ---------- 结果 ---------- */
function renderResult(v){
  var medals = ['🥇','🥈','🥉'];
  var players = v.players.slice().sort(function(a,b){ return b.score - a.score || b.correctCount - a.correctCount; });
  var meHost = false;
  var rows = players.map(function(p, i){
    if (p.id === v.you) meHost = p.isHost;
    var medal = i < 3 ? medals[i] : '<span style="color:#9ca3af;font-weight:700">' + (i + 1) + '</span>';
    var meCls = i === 0 ? 'rrow first' : 'rrow';
    var statHtml = p.isNew
      ? '<b style="color:var(--brand)">--</b>刚加入 · 等待下一局'
      : '<b>' + p.score + ' 分</b>答对 ' + p.correctCount + ' / ' + v.total;
    return '<div class="' + meCls + '">' +
      '<div class="medal">' + medal + '</div>' +
      '<div class="rname">' + esc(p.name) + (p.id === v.you ? '（我）' : '') + '</div>' +
      '<div class="rstat">' + statHtml + '</div>' +
    '</div>';
  }).join('');
  app.innerHTML =
  '<h1>🏆 对战结束</h1>' +
  '<div class="tagline">' + esc(v.bookName) + ' · ' + (v.settings.mode === 'listen' ? '听音辨义' : '看词选义') + ' · ' + v.total + ' 题</div>' +
  '<div class="card rank">' + rows + '</div>' +
  '<div class="card" style="padding:16px">' +
    (meHost
      ? '<button class="btn" id="replayBtn">再来一局 🔁（换一批新词）</button>'
      : '<div class="waiting" style="margin:6px 0 4px">等房主发起再来一局…</div>') +
    '<button class="btn ghost" id="backBtn">返回首页</button>' +
  '</div>';
  var rp = $('#replayBtn');
  if (rp) rp.onclick = function(){
    rp.disabled = true; rp.innerHTML = '<span class="spin"></span>生成新题目…';
    api('/api/replay', { roomId: session.roomId, playerId: session.playerId })
      .catch(function(e){ toast(e.message); rp.disabled = false; rp.innerHTML = '再来一局 🔁'; });
  };
  $('#backBtn').onclick = leaveRoom;
}

/* ---------- 渲染分发 ---------- */
function render(){
  if (page !== 'room' || !cur) return;
  if (cur.phase === 'lobby') renderLobby(cur);
  else if (cur.phase === 'result') renderResult(cur);
  else renderGame(cur);
}

/* ---------- 启动 ---------- */
function boot(){
  applyTheme();
  loadLocalBooks().then(function(books){
    if (books) BOOKS = books.map(function(b){ return { id: b.id, name: b.name, count: (b.words || []).length, lang: b.lang || 'en' }; });
    else return api('/api/books').then(function(d){ BOOKS = d.books; }).catch(function(){});
  }).then(function(){
    return api('/api/info').then(function(d){ INFO = d; }).catch(function(){});
  }).then(function(){
    if (!token) { renderAuth(); return; }
    // 已有令牌：校验有效性并取回账号信息（S3：只有服务器明确返回 401 才清 token；
    // 网络错误/服务器冷启动/弱网一律保留登录态并自动重试，避免「明明有账号却被强制登出」）
    return fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(function(r){
        if (r.status === 401) { token = ''; localStorage.removeItem('vpk_token'); renderAuth(); return; }
        return r.json().catch(function(){ return {}; }).then(function(d){
          if (d && d.username) { account = { username: d.username, name: d.name }; startInviteWatcher(); renderHome(); }
          else { token = ''; localStorage.removeItem('vpk_token'); renderAuth(); }
        });
      })
      .catch(function(){
        // 网络异常：保留登录态，不清 token，5s 后自动重试
        if (typeof toast === 'function') toast('网络异常，登录态已保留，稍后将自动重试');
        if (token && !account) setTimeout(boot, 5000);
        renderAuth();
      });
  });
}
boot();

<script>
/* 注册 Service Worker：让网页可「添加到主屏幕」当作 App 安装，并支持离线打开首页 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').then(function(reg){
      // 检测到新版本安装完成（且当前已有旧版本在运行）→ 自动刷新，确保用户始终拿到最新代码，
      // 避免一直停留在旧的缓存页面（例如「选不了词本/计划」这类其实是旧版页面导致的假象）
      reg.addEventListener('updatefound', function(){
        var installing = reg.installing;
        if (!installing) return;
        installing.addEventListener('statechange', function(){
          if (installing.state === 'installed' && navigator.serviceWorker.controller && !window.__vpkReloading) {
            window.__vpkReloading = true;
            location.reload();
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
